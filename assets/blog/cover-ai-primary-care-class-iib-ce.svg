<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161a2e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6bcf7f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6bcf7f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd93d" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd93d" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="74" text-anchor="middle" fill="#f0f4f8" font-size="36" font-weight="bold" letter-spacing="1">CERTIFIED IN EUROPE, STILL YOUR CALL</text>
  <text x="600" y="110" text-anchor="middle" fill="#8b98a5" font-size="20">Class IIb CE under EU MDR — and the arithmetic it leaves to the health post</text>
  <line x1="110" y1="132" x2="1090" y2="132" stroke="#2b3648" stroke-width="2"/>

  <!-- ================= LEFT: the class ladder ================= -->
  <text x="90" y="176" fill="#8b98a5" font-size="13" letter-spacing="2">THE CLASS LADDER · MDR RULE 11</text>

  <!-- event tag + leader down to the seal -->
  <rect x="300" y="194" width="232" height="30" rx="15" fill="#0b1a22" stroke="#00d2ff" stroke-width="1.5"/>
  <text x="416" y="214" text-anchor="middle" fill="#00d2ff" font-size="13" letter-spacing="1">AIRA · CLASS IIb · 17 SEP 2026</text>
  <line x1="327" y1="224" x2="327" y2="304" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.7"/>

  <!-- certification seal hovering over the IIb step -->
  <circle cx="327" cy="342" r="34" fill="none" stroke="#00d2ff" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 6"/>
  <circle cx="327" cy="342" r="30" fill="#0b1a22" stroke="#00d2ff" stroke-width="2"/>
  <circle cx="327" cy="342" r="23" fill="none" stroke="#00d2ff" stroke-opacity="0.5" stroke-width="1"/>
  <text x="327" y="350" text-anchor="middle" fill="#00d2ff" font-size="19" font-weight="bold">CE</text>

  <!-- the ladder itself -->
  <rect x="90" y="500" width="95" height="60" rx="6" fill="#141a26" stroke="#3d4657" stroke-width="2"/>
  <text x="137" y="537" text-anchor="middle" fill="#8b98a5" font-size="19" font-weight="bold">I</text>

  <rect x="185" y="440" width="95" height="120" rx="6" fill="#1b1730" stroke="#a78bfa" stroke-width="2"/>
  <text x="232" y="477" text-anchor="middle" fill="#a78bfa" font-size="19" font-weight="bold">IIa</text>

  <rect x="280" y="380" width="95" height="180" rx="6" fill="#0e2230" stroke="#00d2ff" stroke-width="3"/>
  <text x="327" y="417" text-anchor="middle" fill="#00d2ff" font-size="19" font-weight="bold">IIb</text>

  <rect x="375" y="320" width="95" height="240" rx="6" fill="#241318" stroke="#ff6b6b" stroke-width="2"/>
  <text x="422" y="357" text-anchor="middle" fill="#ff6b6b" font-size="19" font-weight="bold">III</text>

  <text x="327" y="560" text-anchor="middle" fill="#00d2ff" font-size="11">notified body</text>
  <text x="422" y="520" text-anchor="middle" fill="#ff6b6b" font-size="11">life / serious</text>
  <text x="422" y="534" text-anchor="middle" fill="#ff6b6b" font-size="11">harm</text>

  <!-- ================= RIGHT: the operating point and its queue ================= -->
  <text x="700" y="176" fill="#8b98a5" font-size="13" letter-spacing="2">THE OPERATING POINT · SE 90% / SP 70%</text>

  <path d="M790 415 A 110 110 0 0 1 1010 415" fill="none" stroke="#2b3648" stroke-width="14"/>
  <path d="M790 415 A 110 110 0 0 1 1005 370" fill="none" stroke="#00d2ff" stroke-width="6" stroke-opacity="0.8"/>
  <line x1="790" y1="415" x2="782" y2="429" stroke="#3d4657" stroke-width="2"/>
  <line x1="900" y1="305" x2="900" y2="319" stroke="#3d4657" stroke-width="2"/>
  <line x1="1010" y1="415" x2="1018" y2="429" stroke="#3d4657" stroke-width="2"/>
  <circle cx="900" cy="415" r="7" fill="#0d1117" stroke="#00d2ff" stroke-width="2"/>
  <path d="M900 415 L934 361" stroke="#ffd93d" stroke-width="3" stroke-linecap="round"/>
  <text x="790" y="448" text-anchor="middle" fill="#6bcf7f" font-size="13">Se 90%</text>
  <text x="1010" y="448" text-anchor="middle" fill="#a78bfa" font-size="13">Sp 70%</text>
  <text x="900" y="352" text-anchor="middle" fill="#ffd93d" font-size="12">threshold set here</text>

  <text x="700" y="486" fill="#8b98a5" font-size="12" letter-spacing="1">PER 10,000 SCREENED · 2% PREVALENCE</text>

  <rect x="700" y="498" width="200" height="16" rx="4" fill="url(#ribbonA)"/>
  <text x="912" y="506" fill="#6bcf7f" font-size="13">180 cases found</text>
  <text x="912" y="524" fill="#8b98a5" font-size="12">20 missed — sensitivity</text>

  <rect x="700" y="540" width="200" height="34" rx="4" fill="url(#ribbonB)"/>
  <text x="912" y="552" fill="#ffd93d" font-size="13">2,940 confirmatory tests</text>
  <text x="912" y="570" fill="#8b98a5" font-size="12">16.3 referrals per case — specificity</text>

  <text x="600" y="620" text-anchor="middle" fill="#c9d1d9" font-size="16">Europe certifies the algorithm; the health post sets the threshold.</text>
  <text x="1140" y="604" text-anchor="end" fill="#586069" font-size="12">ml-ke.github.io</text>
</svg>
