<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="40%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#00d2ff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
  </g>
  <!-- Chip wafer abstract -->
  <g transform="translate(600, 315)" fill="none">
    <circle r="200" stroke="#6bcf7f" stroke-opacity="0.08" stroke-width="1"/>
    <circle r="160" stroke="#6bcf7f" stroke-opacity="0.06" stroke-width="0.5"/>
    <circle r="120" stroke="#a78bfa" stroke-opacity="0.1" stroke-width="0.5"/>
    <!-- Die grid -->
    <g stroke="#6bcf7f" stroke-opacity="0.12" stroke-width="0.5">
      <line x1="-80" y1="-80" x2="80" y2="-80"/>
      <line x1="-80" y1="-40" x2="80" y2="-40"/>
      <line x1="-80" y1="0" x2="80" y2="0"/>
      <line x1="-80" y1="40" x2="80" y2="40"/>
      <line x1="-80" y1="80" x2="80" y2="80"/>
      <line x1="-80" y1="-80" x2="-80" y2="80"/>
      <line x1="-40" y1="-80" x2="-40" y2="80"/>
      <line x1="0" y1="-80" x2="0" y2="80"/>
      <line x1="40" y1="-80" x2="40" y2="80"/>
      <line x1="80" y1="-80" x2="80" y2="80"/>
    </g>
  </g>
  <!-- Title -->
  <text x="600" y="160" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="bold" fill="#ffffff" letter-spacing="1">DeepSeek's $52 Billion Moment</text>
  <text x="600" y="200" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#a78bfa" letter-spacing="1">Valuation Surge &amp; the Custom Chip Pivot</text>
  <text x="50" y="595" font-family="monospace" font-size="14" fill="#8b949e" opacity="0.6">ml-ke.github.io</text>
