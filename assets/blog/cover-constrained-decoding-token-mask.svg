<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2440"/>
      <stop offset="100%" stop-color="#151a30"/>
    </linearGradient>
    <linearGradient id="doc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111a2b"/>
      <stop offset="100%" stop-color="#0e1524"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path d="M100 0V630M200 0V630M300 0V630M400 0V630M500 0V630M600 0V630M700 0V630M800 0V630M900 0V630M1000 0V630M1100 0V630"/>
  </g>

  <text x="60" y="66" fill="#f5f7fa" font-size="36" font-weight="700">The Mask Is the Contract</text>
  <text x="60" y="102" fill="#9aa7bd" font-size="19">Grammar-constrained decoding: what it guarantees, what it cannot</text>
  <line x1="60" y1="122" x2="1140" y2="122" stroke="#2a3350" stroke-width="1"/>

  <!-- token stream, left -->
  <text x="60" y="168" fill="#6b7a97" font-size="13" letter-spacing="2">TOKEN STREAM</text>
  <g font-size="17" fill="#c8d3e6">
    <rect x="60" y="182" width="150" height="34" rx="6" fill="#161d33" stroke="#2a3350"/>
    <text x="76" y="205">Sure, here is</text>
    <rect x="60" y="226" width="150" height="34" rx="6" fill="#161d33" stroke="#2a3350"/>
    <text x="76" y="249">```json</text>
    <rect x="60" y="270" width="150" height="34" rx="6" fill="#0f2318" stroke="#6bcf7f"/>
    <text x="76" y="293">{</text>
    <rect x="60" y="314" width="150" height="34" rx="6" fill="#0f2318" stroke="#6bcf7f"/>
    <text x="76" y="337">"name"</text>
    <rect x="60" y="358" width="150" height="34" rx="6" fill="#2a1518" stroke="#ff6b6b"/>
    <text x="76" y="381">"nickname"</text>
    <rect x="60" y="402" width="150" height="34" rx="6" fill="#2a1518" stroke="#ff6b6b"/>
    <text x="76" y="425">151</text>
    <rect x="60" y="446" width="150" height="34" rx="6" fill="#0f2318" stroke="#6bcf7f"/>
    <text x="76" y="469">}</text>
  </g>
  <g stroke="#ff6b6b" stroke-width="2" opacity="0.85">
    <path d="M70 375 L200 397"/>
    <path d="M70 419 L200 441"/>
  </g>
  <text x="212" y="390" fill="#ff6b6b" font-size="15">-inf</text>
  <text x="212" y="434" fill="#ff6b6b" font-size="15">-inf</text>

  <!-- mask plate -->
  <g>
    <rect x="250" y="150" width="290" height="346" rx="18" fill="url(#plate)" stroke="#00d2ff" stroke-width="2" filter="url(#glow)"/>
    <text x="272" y="182" fill="#00d2ff" font-size="13" letter-spacing="2">MASK PLATE</text>
    <rect x="278" y="200" width="234" height="74" rx="10" fill="#0b1120" stroke="#33436b" stroke-dasharray="5 4"/>
    <rect x="278" y="292" width="234" height="74" rx="10" fill="#0b1120" stroke="#33436b" stroke-dasharray="5 4"/>
    <rect x="278" y="384" width="234" height="74" rx="10" fill="#0b1120" stroke="#33436b" stroke-dasharray="5 4"/>
    <text x="296" y="228" fill="#8fa3c8" font-size="13">WINDOW 1</text>
    <text x="296" y="250" fill="#6bcf7f" font-size="15">"name" : string</text>
    <text x="296" y="320" fill="#8fa3c8" font-size="13">WINDOW 2</text>
    <text x="296" y="342" fill="#6bcf7f" font-size="15">"age" : int 0..150</text>
    <text x="296" y="412" fill="#8fa3c8" font-size="13">WINDOW 3</text>
    <text x="296" y="434" fill="#6bcf7f" font-size="15">close, then stop</text>
    <text x="272" y="480" fill="#9aa7bd" font-size="12">one automaton, evaluated every step</text>
  </g>

  <!-- automaton state graph -->
  <g>
    <text x="580" y="200" fill="#6b7a97" font-size="13" letter-spacing="2">STATES</text>
    <circle cx="612" cy="240" r="18" fill="#0b1120" stroke="#a78bfa" stroke-width="2"/>
    <text x="604" y="246" fill="#d8ccff" font-size="14">S1</text>
    <path d="M634 240 L694 240" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)"/>
    <circle cx="714" cy="240" r="18" fill="#0b1120" stroke="#a78bfa" stroke-width="2"/>
    <text x="706" y="246" fill="#d8ccff" font-size="14">S2</text>
    <path d="M736 240 L796 240" stroke="#a78bfa" stroke-width="2" marker-end="url(#a)"/>
    <circle cx="816" cy="240" r="18" fill="#0b1120" stroke="#ffd93d" stroke-width="2"/>
    <text x="808" y="246" fill="#ffe9a3" font-size="14">S3</text>
    <text x="580" y="290" fill="#8fa3c8" font-size="13">mask per state, cached</text>
    <text x="580" y="312" fill="#6bcf7f" font-size="14">64 states / 25450 lookups</text>
    <text x="580" y="334" fill="#6bcf7f" font-size="14">99.8% cache hits</text>
  </g>

  <!-- output document -->
  <g>
    <rect x="880" y="160" width="260" height="220" rx="14" fill="url(#doc)" stroke="#2a3350"/>
    <text x="900" y="190" fill="#6b7a97" font-size="13" letter-spacing="2">OUTPUT</text>
    <text x="900" y="220" fill="#c8d3e6" font-size="15">{</text>
    <text x="916" y="246" fill="#9fd6ff" font-size="15">"name": "ageifhere35}",</text>
    <text x="916" y="272" fill="#9fd6ff" font-size="15">"age": 34</text>
    <text x="900" y="298" fill="#c8d3e6" font-size="15">}</text>
    <text x="900" y="330" fill="#6bcf7f" font-size="15">parseable 1000 / 1000</text>
    <text x="900" y="356" fill="#ffd93d" font-size="15">name plausible 520 / 1000</text>
  </g>

  <!-- bottom stat strip -->
  <g>
    <rect x="60" y="522" width="330" height="72" rx="12" fill="#141b2e" stroke="#2a3350"/>
    <text x="80" y="552" fill="#ff6b6b" font-size="22" font-weight="700">-inf</text>
    <text x="80" y="578" fill="#9aa7bd" font-size="14">set on every illegal token, every step</text>
    <rect x="410" y="522" width="330" height="72" rx="12" fill="#141b2e" stroke="#2a3350"/>
    <text x="430" y="552" fill="#ffd93d" font-size="22" font-weight="700">36%</text>
    <text x="430" y="578" fill="#9aa7bd" font-size="14">steps where the top token was masked</text>
    <rect x="760" y="522" width="380" height="72" rx="12" fill="#141b2e" stroke="#2a3350"/>
    <text x="780" y="552" fill="#6bcf7f" font-size="22" font-weight="700">syntax yes, meaning no</text>
    <text x="780" y="578" fill="#9aa7bd" font-size="14">the schema is never injected into the prompt</text>
  </g>

  <text x="1140" y="616" fill="#6b7a97" font-size="14" text-anchor="end">ml-ke.github.io</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>
</svg>
