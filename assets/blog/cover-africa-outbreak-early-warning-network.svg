<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.45"/>
    </linearGradient>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#ff6b6b" stroke-width="3" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- grid lines -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.03">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <text x="60" y="66" fill="#f0f3f8" font-size="34" font-weight="bold">Detected is not detected early</text>
  <text x="60" y="100" fill="#9aa4b2" font-size="19">Africa's open-source outbreak radar, 2018 to 2023: a signal for 81.0% of notified events, an early signal for 47.4%</text>

  <!-- PANEL A: member-state tile grid -->
  <g>
    <text x="60" y="158" fill="#6bcf7f" font-size="15" font-weight="bold">44 OF 47 MEMBER STATES ON THE NETWORK</text>
    <g fill="url(#lit)" stroke="#00d2ff" stroke-width="1">
      <rect x="60" y="176" width="30" height="20" rx="3"/><rect x="94" y="176" width="30" height="20" rx="3"/><rect x="128" y="176" width="30" height="20" rx="3"/><rect x="162" y="176" width="30" height="20" rx="3"/><rect x="196" y="176" width="30" height="20" rx="3"/><rect x="230" y="176" width="30" height="20" rx="3"/><rect x="264" y="176" width="30" height="20" rx="3"/><rect x="298" y="176" width="30" height="20" rx="3"/><rect x="332" y="176" width="30" height="20" rx="3"/><rect x="366" y="176" width="30" height="20" rx="3"/>
      <rect x="60" y="204" width="30" height="20" rx="3"/><rect x="94" y="204" width="30" height="20" rx="3"/><rect x="128" y="204" width="30" height="20" rx="3"/><rect x="162" y="204" width="30" height="20" rx="3"/><rect x="196" y="204" width="30" height="20" rx="3"/><rect x="230" y="204" width="30" height="20" rx="3"/><rect x="264" y="204" width="30" height="20" rx="3"/><rect x="298" y="204" width="30" height="20" rx="3"/><rect x="332" y="204" width="30" height="20" rx="3"/><rect x="366" y="204" width="30" height="20" rx="3"/>
      <rect x="60" y="232" width="30" height="20" rx="3"/><rect x="94" y="232" width="30" height="20" rx="3"/><rect x="128" y="232" width="30" height="20" rx="3"/><rect x="162" y="232" width="30" height="20" rx="3"/><rect x="196" y="232" width="30" height="20" rx="3"/><rect x="230" y="232" width="30" height="20" rx="3"/><rect x="264" y="232" width="30" height="20" rx="3"/><rect x="298" y="232" width="30" height="20" rx="3"/><rect x="332" y="232" width="30" height="20" rx="3"/><rect x="366" y="232" width="30" height="20" rx="3"/>
      <rect x="60" y="260" width="30" height="20" rx="3"/><rect x="94" y="260" width="30" height="20" rx="3"/><rect x="128" y="260" width="30" height="20" rx="3"/><rect x="162" y="260" width="30" height="20" rx="3"/><rect x="196" y="260" width="30" height="20" rx="3"/><rect x="230" y="260" width="30" height="20" rx="3"/><rect x="264" y="260" width="30" height="20" rx="3"/><rect x="298" y="260" width="30" height="20" rx="3"/><rect x="332" y="260" width="30" height="20" rx="3"/><rect x="366" y="260" width="30" height="20" rx="3"/>
      <rect x="60" y="288" width="30" height="20" rx="3"/><rect x="94" y="288" width="30" height="20" rx="3"/><rect x="128" y="288" width="30" height="20" rx="3"/><rect x="196" y="288" width="30" height="20" rx="3"/>
    </g>
    <g fill="#2a2f3a" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="3 3">
      <rect x="162" y="288" width="30" height="20" rx="3"/>
      <rect x="230" y="288" width="30" height="20" rx="3"/>
      <rect x="264" y="288" width="30" height="20" rx="3"/>
    </g>
    <text x="60" y="334" fill="#c8cfda" font-size="13">126 new signals in 2025</text>
    <text x="60" y="354" fill="#c8cfda" font-size="13">radio mining plus ML signal classification added</text>
    <text x="60" y="374" fill="#9aa4b2" font-size="13">laboratories and national officers still verify every signal</text>
  </g>

  <!-- PANEL B: radio to text -->
  <g>
    <line x1="500" y1="228" x2="500" y2="330" stroke="#ffd93d" stroke-width="4"/>
    <path d="M470 228 L480 200 L500 216 L520 200 L530 228 Z" fill="#ffd93d" opacity="0.85"/>
    <path d="M462 186 A54 54 0 0 1 538 186" fill="none" stroke="#ffd93d" stroke-width="3" opacity="0.7"/>
    <path d="M446 166 A80 80 0 0 1 554 166" fill="none" stroke="#ffd93d" stroke-width="3" opacity="0.4"/>
    <text x="440" y="352" fill="#ffd93d" font-size="13">community radio</text>
    <polyline points="560,252 572,238 584,266 596,240 608,262 620,244 632,258 644,248 656,256 668,250"
              fill="none" stroke="#00d2ff" stroke-width="2.5"/>
    <text x="560" y="286" fill="#00d2ff" font-size="13">speech-to-text</text>
    <g fill="#a78bfa" opacity="0.85">
      <rect x="560" y="300" width="118" height="7" rx="3"/>
      <rect x="560" y="314" width="92" height="7" rx="3"/>
      <rect x="560" y="328" width="106" height="7" rx="3"/>
      <rect x="560" y="342" width="70" height="7" rx="3"/>
    </g>
  </g>

  <!-- PANEL C: the clock -->
  <g>
    <text x="760" y="158" fill="#ff6b6b" font-size="15" font-weight="bold">THE TAIL A MEDIAN HIDES</text>
    <rect x="994" y="196" width="126" height="56" fill="url(#hatch)" stroke="#ff6b6b" stroke-width="1"/>
    <line x1="760" y1="252" x2="1120" y2="252" stroke="#9aa4b2" stroke-width="2"/>
    <g stroke="#9aa4b2" stroke-width="1.5">
      <line x1="760" y1="246" x2="760" y2="258"/>
      <line x1="832" y1="246" x2="832" y2="258"/>
      <line x1="868" y1="244" x2="868" y2="260"/>
      <line x1="904" y1="246" x2="904" y2="258"/>
      <line x1="994" y1="246" x2="994" y2="258"/>
      <line x1="1120" y1="246" x2="1120" y2="258"/>
    </g>
    <text x="756" y="278" fill="#9aa4b2" font-size="13">-6</text>
    <text x="822" y="278" fill="#9aa4b2" font-size="13">-2</text>
    <text x="862" y="278" fill="#f0f3f8" font-size="13">notification</text>
    <text x="898" y="278" fill="#9aa4b2" font-size="13">+2</text>
    <text x="982" y="278" fill="#ff6b6b" font-size="13">day 7</text>
    <rect x="796" y="238" width="162" height="8" rx="4" fill="#6bcf7f" opacity="0.55"/>
    <text x="796" y="232" fill="#6bcf7f" font-size="12">IQR -4 to +5 days</text>
    <circle cx="886" cy="242" r="7" fill="#6bcf7f" stroke="#0d1117" stroke-width="2"/>
    <text x="862" y="220" fill="#6bcf7f" font-size="13" font-weight="bold">median 0 days</text>
    <text x="934" y="320" fill="#c8cfda" font-size="13">median 0 days hides it:</text>
    <text x="934" y="340" fill="#ff6b6b" font-size="13">a quarter of events</text>
    <text x="934" y="358" fill="#ff6b6b" font-size="13">had no signal until</text>
    <text x="934" y="376" fill="#ff6b6b" font-size="13">5 days after notification</text>
    <line x1="928" y1="300" x2="928" y2="386" stroke="#ff6b6b" stroke-width="1" opacity="0.5"/>
  </g>

  <!-- stat chips -->
  <g>
    <rect x="60" y="430" width="330" height="92" rx="10" fill="#131a24" stroke="#6bcf7f" stroke-width="1.5"/>
    <text x="80" y="468" fill="#6bcf7f" font-size="28" font-weight="bold">81.0%</text>
    <text x="80" y="496" fill="#c8cfda" font-size="14">of 646 notified events had a signal</text>

    <rect x="435" y="430" width="330" height="92" rx="10" fill="#131a24" stroke="#ffd93d" stroke-width="1.5"/>
    <text x="455" y="468" fill="#ffd93d" font-size="28" font-weight="bold">47.4%</text>
    <text x="455" y="496" fill="#c8cfda" font-size="14">had it before official notification</text>

    <rect x="810" y="430" width="330" height="92" rx="10" fill="#131a24" stroke="#ff6b6b" stroke-width="1.5"/>
    <text x="830" y="468" fill="#ff6b6b" font-size="28" font-weight="bold">19.0%</text>
    <text x="830" y="496" fill="#c8cfda" font-size="14">were never detected at all</text>
  </g>

  <text x="60" y="570" fill="#6b7280" font-size="14">coverage rose 11.8 points from 2018 to 2023; earliness rose 3.2</text>
  <text x="1140" y="600" fill="#6b7280" font-size="16" text-anchor="end">ml-ke.github.io</text>
</svg>
