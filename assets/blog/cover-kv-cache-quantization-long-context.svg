<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1a1a2e"/></linearGradient>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<g stroke="#ffffff" stroke-opacity="0.03">
<line x1="60" y1="0" x2="60" y2="630"/><line x1="140" y1="0" x2="140" y2="630"/>
<line x1="220" y1="0" x2="220" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
<line x1="380" y1="0" x2="380" y2="630"/><line x1="460" y1="0" x2="460" y2="630"/>
<line x1="540" y1="0" x2="540" y2="630"/><line x1="620" y1="0" x2="620" y2="630"/>
<line x1="700" y1="0" x2="700" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
<line x1="860" y1="0" x2="860" y2="630"/><line x1="940" y1="0" x2="940" y2="630"/>
<line x1="1020" y1="0" x2="1020" y2="630"/><line x1="1100" y1="0" x2="1100" y2="630"/>
<line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/>
<line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/>
<line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/>
<line x1="0" y1="560" x2="1200" y2="560"/>
</g>
<text x="60" y="64" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="33" font-weight="600" fill="#e6edf3">Half the Cache, Twice the Context</text>
<text x="60" y="102" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">KV cache quantization at 128k: the bytes halve, the accumulator does not</text>
<line x1="60" y1="128" x2="1140" y2="128" stroke="#30363d"/>

<text x="60" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c9d1d9">storage: one key vector per token</text>
<rect x="60" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.95"/>
<rect x="77" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.9"/>
<rect x="94" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.85"/>
<rect x="111" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.9"/>
<rect x="128" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.8"/>
<rect x="145" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.9"/>
<rect x="162" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.85"/>
<rect x="179" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.9"/>
<rect x="196" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.8"/>
<rect x="213" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.88"/>
<rect x="230" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.9"/>
<rect x="247" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.82"/>
<rect x="264" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.9"/>
<rect x="281" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.86"/>
<rect x="298" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.9"/>
<rect x="315" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.8"/>
<rect x="332" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.9"/>
<rect x="349" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.88"/>
<rect x="366" y="190" width="14" height="14" rx="2" fill="#00d2ff" fill-opacity="0.9"/>
<text x="60" y="238" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#ffd93d">quantize to 4 bits, scale per channel</text>
<rect x="60" y="252" width="42" height="14" rx="2" fill="#ffd93d" fill-opacity="0.45"/>
<rect x="104" y="252" width="42" height="14" rx="2" fill="#ffd93d" fill-opacity="0.45"/>
<rect x="148" y="252" width="42" height="14" rx="2" fill="#ffd93d" fill-opacity="0.45"/>
<rect x="192" y="252" width="42" height="14" rx="2" fill="#ff6b6b" fill-opacity="0.8"/>
<rect x="236" y="252" width="42" height="14" rx="2" fill="#ffd93d" fill-opacity="0.45"/>
<rect x="280" y="252" width="42" height="14" rx="2" fill="#ffd93d" fill-opacity="0.45"/>
<rect x="324" y="252" width="42" height="14" rx="2" fill="#ffd93d" fill-opacity="0.45"/>
<rect x="368" y="252" width="42" height="14" rx="2" fill="#ffd93d" fill-opacity="0.45"/>
<text x="60" y="292" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">8 outlier channels own the range</text>
<text x="60" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">everything finer rounds to zero</text>

<text x="450" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c9d1d9">memory: Llama-3.1-8B at 128k</text>
<rect x="450" y="192" width="200" height="26" rx="4" fill="#00d2ff" fill-opacity="0.85"/>
<text x="666" y="211" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#00d2ff">16.0 GiB bf16</text>
<text x="450" y="248" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#6bcf7f">half the bytes</text>
<rect x="450" y="260" width="100" height="26" rx="4" fill="#6bcf7f" fill-opacity="0.85"/>
<text x="566" y="279" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#6bcf7f">8.0 GiB fp8</text>
<text x="450" y="318" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">24 concurrent 8k requests in 24 GiB</text>
<text x="450" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">48 of them at one byte per value</text>

<text x="740" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c9d1d9">the accumulator</text>
<path d="M 785 330 A 150 150 0 0 1 1085 330" fill="none" stroke="#30363d" stroke-width="14" stroke-linecap="round"/>
<path d="M 785 330 A 150 150 0 0 1 812 321" fill="none" stroke="#ff6b6b" stroke-width="14" stroke-linecap="round"/>
<line x1="935" y1="330" x2="806" y2="325" stroke="#ffd93d" stroke-width="3" stroke-linecap="round"/>
<circle cx="935" cy="330" r="6" fill="#ffd93d"/>
<text x="785" y="368" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#ff6b6b">0.00195</text>
<text x="785" y="388" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">bf16 accumulator lands here</text>
<text x="1085" y="368" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#6bcf7f">1.000</text>
<text x="1085" y="388" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">softmax weights sum here</text>
<text x="740" y="432" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">one flat distribution over 131,072 tokens,</text>
<text x="740" y="450" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">summed in a bf16 register, returns 0.001953</text>

<text x="60" y="536" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#e6edf3">The bytes halve on arithmetic. Which half survives depends on the accumulator's bit width.</text>
<text x="60" y="566" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">A stdlib + numpy measurement you can run on your own configuration - no GPU required.</text>
<text x="1140" y="612" text-anchor="end" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#484f58">ml-ke.github.io</text>
</svg>
