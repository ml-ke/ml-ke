<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Eight trial dots with one lucky success scoring 0.88 on pass@8, and a score bar collapsed to a stub for pass^8">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3f9e5c"/>
      <stop offset="100%" stop-color="#6bcf7f"/>
    </linearGradient>
    <linearGradient id="bad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f2f2f"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#6bcf7f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6bcf7f" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="74" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="bold" fill="#e6edf3">pass@k is not reliability</text>
  <text x="600" y="112" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="21" fill="#8b949e">sizing an eval so the pass^k you publish survives</text>

  <g>
    <circle cx="313" cy="212" r="46" fill="url(#glow)"/>
    <circle cx="313" cy="212" r="24" fill="#6bcf7f" stroke="#b6f0c4" stroke-width="2"/>
    <text x="313" y="220" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="18" font-weight="bold" fill="#0d1117">1</text>

    <circle cx="395" cy="212" r="24" fill="#20242e" stroke="#ff6b6b" stroke-width="2" stroke-opacity="0.75"/>
    <circle cx="477" cy="212" r="24" fill="#20242e" stroke="#ff6b6b" stroke-width="2" stroke-opacity="0.75"/>
    <circle cx="559" cy="212" r="24" fill="#20242e" stroke="#ff6b6b" stroke-width="2" stroke-opacity="0.75"/>
    <circle cx="641" cy="212" r="24" fill="#20242e" stroke="#ff6b6b" stroke-width="2" stroke-opacity="0.75"/>
    <circle cx="723" cy="212" r="24" fill="#20242e" stroke="#ff6b6b" stroke-width="2" stroke-opacity="0.75"/>
    <circle cx="805" cy="212" r="24" fill="#20242e" stroke="#ff6b6b" stroke-width="2" stroke-opacity="0.75"/>
    <circle cx="887" cy="212" r="24" fill="#20242e" stroke="#ff6b6b" stroke-width="2" stroke-opacity="0.75"/>

    <text x="395" y="218" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15" fill="#ff6b6b" fill-opacity="0.7">x</text>
    <text x="477" y="218" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15" fill="#ff6b6b" fill-opacity="0.7">x</text>
    <text x="559" y="218" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15" fill="#ff6b6b" fill-opacity="0.7">x</text>
    <text x="641" y="218" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15" fill="#ff6b6b" fill-opacity="0.7">x</text>
    <text x="723" y="218" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15" fill="#ff6b6b" fill-opacity="0.7">x</text>
    <text x="805" y="218" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15" fill="#ff6b6b" fill-opacity="0.7">x</text>
    <text x="887" y="218" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15" fill="#ff6b6b" fill-opacity="0.7">x</text>
  </g>

  <text x="600" y="282" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="16" fill="#8b949e">eight trials of one task: one success, seven failures</text>

  <g font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
    <text x="120" y="352" font-size="22" font-weight="bold" fill="#e6edf3">pass@8</text>
    <text x="120" y="374" font-size="13" fill="#8b949e">any one of eight</text>
    <rect x="290" y="330" width="620" height="30" rx="15" fill="#20242e"/>
    <rect x="290" y="330" width="546" height="30" rx="15" fill="url(#good)"/>
    <text x="1030" y="353" font-size="26" font-weight="bold" fill="#6bcf7f">0.88</text>

    <text x="120" y="452" font-size="22" font-weight="bold" fill="#e6edf3">pass^8</text>
    <text x="120" y="474" font-size="13" fill="#8b949e">all eight</text>
    <rect x="290" y="430" width="620" height="30" rx="15" fill="#20242e"/>
    <rect x="290" y="430" width="13" height="30" rx="6" fill="url(#bad)"/>
    <text x="1030" y="453" font-size="26" font-weight="bold" fill="#ff6b6b">0.00004</text>
  </g>


  <text x="600" y="530" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="17" fill="#8b949e">the same eight trials, two readings: one lucky retry lifts the first number,</text>
  <text x="600" y="558" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="17" fill="#8b949e">and the second one has to carry all of them</text>

  <text x="1160" y="608" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="15" fill="#6e7681">ml-ke.github.io</text>
</svg>
