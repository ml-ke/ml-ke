<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- title -->
  <text x="600" y="85" text-anchor="middle" font-family="sans-serif" font-size="46" font-weight="bold" fill="#f0f6fc">DEEPSEEK V4</text>
  <text x="600" y="132" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="bold" fill="#00d2ff">PEAK / OFF-PEAK PRICING</text>
  <text x="600" y="168" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#8899aa">Time-of-day billing from Aug 16, 2026</text>

  <!-- clock: center 400,370 radius 170 -->
  <!-- off-peak base ring -->
  <circle cx="400" cy="370" r="170" fill="none" stroke="#00d2ff" stroke-opacity="0.5" stroke-width="24"/>
  <!-- outer rim -->
  <circle cx="400" cy="370" r="158" fill="none" stroke="#2a3a55" stroke-width="3"/>
  <!-- peak arc 1: 01:00-04:00 (300deg to 30deg) -->
  <path d="M 485 222.8 A 170 170 0 0 1 547.2 455" fill="none" stroke="#ff6b6b" stroke-width="24" stroke-linecap="round"/>
  <!-- peak arc 2: 06:00-10:00 (90deg to 210deg) -->
  <path d="M 400 540 A 170 170 0 0 1 252.8 285" fill="none" stroke="#ff6b6b" stroke-width="24" stroke-linecap="round"/>
  <!-- hour ticks -->
  <g stroke="#c9d1d9" stroke-width="3" stroke-linecap="round">
    <line x1="400" y1="216" x2="400" y2="232"/>
    <line x1="558" y1="370" x2="542" y2="370"/>
    <line x1="400" y1="524" x2="400" y2="508"/>
    <line x1="242" y1="370" x2="258" y2="370"/>
  </g>
  <!-- clock center dot -->
  <circle cx="400" cy="370" r="8" fill="#f0f6fc"/>

  <!-- chain from clock to price tag -->
  <line x1="547" y1="285" x2="740" y2="330" stroke="#8899aa" stroke-width="3" stroke-dasharray="7 6"/>

  <!-- price tag (diamond) -->
  <polygon points="850,330 960,430 850,530 740,430" fill="#ffd93d"/>
  <circle cx="850" cy="364" r="16" fill="#1a1a2e"/>
  <text x="850" y="452" text-anchor="middle" font-family="sans-serif" font-size="58" font-weight="bold" fill="#0d1117">$</text>

  <!-- legend -->
  <rect x="100" y="548" width="18" height="18" rx="4" fill="#ff6b6b"/>
  <text x="128" y="563" font-family="sans-serif" font-size="19" fill="#e6edf3">PEAK  ·  2x off-peak</text>
  <rect x="100" y="582" width="18" height="18" rx="4" fill="#00d2ff" fill-opacity="0.5"/>
  <text x="128" y="597" font-family="sans-serif" font-size="19" fill="#e6edf3">OFF-PEAK  ·  half of peak</text>

  <!-- logo -->
  <text x="1120" y="602" text-anchor="end" font-family="sans-serif" font-size="16" fill="#8899aa">ml-ke.github.io</text>
</svg>
