<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#1a1a3e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6bcf7f" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid lines -->
  <g stroke="#a78bfa" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="0" y1="630" x2="1200" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Globe wireframe -->
  <g transform="translate(600, 315)" stroke="#00d2ff" stroke-opacity="0.3" fill="none" stroke-width="1.5">
    <ellipse rx="220" ry="180"/>
    <ellipse rx="220" ry="60"/>
    <ellipse rx="60" ry="180"/>
    <line x1="-220" y1="0" x2="220" y2="0"/>
    <line x1="0" y1="-180" x2="0" y2="180"/>
  </g>

  <!-- Data nodes on globe -->
  <g fill="#6bcf7f">
    <circle cx="540" cy="270" r="6" opacity="0.9"/>
    <circle cx="620" cy="250" r="5" opacity="0.7"/>
    <circle cx="580" cy="320" r="4" opacity="0.8"/>
    <circle cx="660" cy="300" r="5" opacity="0.6"/>
    <circle cx="520" cy="340" r="4" opacity="0.7"/>
    <circle cx="640" cy="270" r="3" opacity="0.9"/>
    <circle cx="560" cy="360" r="4" opacity="0.5"/>
    <circle cx="680" cy="340" r="3" opacity="0.6"/>
  </g>

  <!-- Connection lines between nodes -->
  <g stroke="#6bcf7f" stroke-opacity="0.3" stroke-width="1">
    <line x1="540" y1="270" x2="620" y2="250"/>
    <line x1="620" y1="250" x2="660" y2="300"/>
    <line x1="580" y1="320" x2="540" y2="270"/>
    <line x1="580" y1="320" x2="660" y2="300"/>
    <line x1="520" y1="340" x2="580" y2="320"/>
    <line x1="640" y1="270" x2="620" y2="250"/>
    <line x1="560" y1="360" x2="520" y2="340"/>
    <line x1="680" y1="340" x2="660" y2="300"/>
  </g>

  <!-- Pulse rings -->
  <g transform="translate(600, 315)" fill="none" stroke="#a78bfa" stroke-opacity="0.15" stroke-width="1">
    <circle r="240"/>
    <circle r="260"/>
    <circle r="280"/>
  </g>

  <!-- Regional markers -->
  <g font-family="monospace" font-size="11" fill="#ffd93d" opacity="0.4">
    <text x="700" y="240">ASIA</text>
    <text x="660" y="200">EUROPE</text>
    <text x="720" y="280">MENA</text>
    <text x="680" y="360">AFRICA</text>
    <text x="560" y="200">AMERICAS</text>
    <text x="740" y="320">S.AMERICA</text>
  </g>

  <!-- Title -->
  <text x="600" y="140" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="bold" fill="#ffffff" letter-spacing="2">
    Global AI Roundup
  </text>
  <text x="600" y="175" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#a78bfa" letter-spacing="1">
    July 2026 — Across 7 Regions
  </text>

  <!-- Subtitle line -->
  <g transform="translate(320, 195)">
    <line x1="0" y1="0" x2="560" y2="0" stroke="#a78bfa" stroke-opacity="0.3" stroke-width="1"/>
  </g>

  <!-- Bottom info -->
  <text x="50" y="595" font-family="monospace" font-size="14" fill="#8b949e" opacity="0.6">ml-ke.github.io</text>
  <text x="1150" y="595" text-anchor="end" font-family="monospace" font-size="14" fill="#8b949e" opacity="0.6">July 2026</text>

  <!-- Decorative dots bottom right -->
  <g fill="#00d2ff" opacity="0.3">
    <circle cx="1050" cy="560" r="3"/>
    <circle cx="1065" cy="570" r="2"/>
    <circle cx="1080" cy="555" r="2.5"/>
    <circle cx="1095" cy="565" r="1.5"/>
    <circle cx="1110" cy="560" r="2"/>
  </g>
</svg>