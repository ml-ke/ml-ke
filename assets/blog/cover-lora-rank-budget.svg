<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A large frozen weight slab beside two thin adapter plates labelled B and A, joined by a low-rank bracket, with a rank dial and a curve that flattens at an error floor far above zero">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="plateB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3aa8c8"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="plateA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b6fd6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2230"/>
      <stop offset="100%" stop-color="#141924"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <pattern id="cells" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 L0 0 0 24" fill="none" stroke="#2f3947" stroke-opacity="0.9" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="74" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="bold" fill="#e6edf3">rank is a budget</text>
  <text x="600" y="112" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="21" fill="#8b949e">what LoRA at r=8 costs and buys on an 8B model</text>

  <g>
    <text x="96" y="168" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15"
          fill="#8b949e">frozen base</text>
    <rect x="96" y="180" width="300" height="250" rx="8" fill="url(#slab)" stroke="#2a2f3a" stroke-width="2"/>
    <rect x="96" y="180" width="300" height="250" rx="8" fill="url(#cells)"/>
    <text x="246" y="300" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="30" font-weight="bold" fill="#5f6b7d">W</text>
    <text x="246" y="330" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15" fill="#5f6b7d">4096 x 4096, no gradient</text>
    <text x="246" y="462" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15" fill="#8b949e">8.19B params across 36 layers</text>

    <path d="M404 250 L452 250" stroke="#6bcf7f" stroke-width="3"/>
    <path d="M444 244 L454 250 L444 256" fill="none" stroke="#6bcf7f" stroke-width="3"/>
    <text x="428" y="236" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="14" fill="#6bcf7f">+</text>

    <rect x="464" y="216" width="46" height="56" rx="4" fill="url(#plateB)"/>
    <text x="487" y="250" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15" font-weight="bold" fill="#0d1117">B</text>
    <text x="487" y="296" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="14" fill="#00d2ff">4096 x r</text>

    <text x="524" y="250" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="24" fill="#8b949e">x</text>

    <rect x="546" y="232" width="46" height="24" rx="4" fill="url(#plateA)"/>
    <text x="569" y="250" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15" font-weight="bold" fill="#0d1117">A</text>
    <text x="569" y="296" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="14" fill="#a78bfa">r x 4096</text>

    <text x="556" y="352" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15" fill="#c9d1d9">the only thing you train</text>
    <text x="556" y="380" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15" font-weight="bold" fill="#e6edf3">21.8M params, 0.27%</text>
    <text x="556" y="404" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15" fill="#8b949e">0.35 GB of optimizer state</text>

    <rect x="464" y="430" width="128" height="26" rx="13" fill="#12161f" stroke="#00d2ff" stroke-width="1.5"/>
    <text x="528" y="448" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="14" fill="#00d2ff">all linear, r = 8</text>
  </g>

  <g>
    <text x="720" y="168" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17"
          fill="#e6edf3">error against a planted rank-8 update</text>
    <text x="720" y="192" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14"
          fill="#8b949e">64 x 64 weight, fixed seed, same optimizer</text>

    <line x1="740" y1="440" x2="1130" y2="440" stroke="#2f3644" stroke-width="2"/>
    <line x1="740" y1="220" x2="740" y2="440" stroke="#2f3644" stroke-width="2"/>

    <path d="M760 246 L800 330 L840 388 L880 432 L920 438 L1000 439 L1090 439"
          fill="none" stroke="#6bcf7f" stroke-width="3"/>
    <circle cx="760" cy="246" r="5" fill="#ff6b6b"/>
    <circle cx="840" cy="388" r="5" fill="#ffd93d"/>
    <circle cx="920" cy="438" r="5" fill="#6bcf7f"/>

    <line x1="740" y1="440" x2="1130" y2="440" stroke="#6bcf7f" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.5"/>

    <text x="762" y="232" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#ff6b6b">r=1: 86.8%</text>
    <text x="846" y="374" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#ffd93d">r=4: 50.1%</text>
    <text x="930" y="426" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#6bcf7f">r=8: 0.0%</text>

    <text x="740" y="466" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">rank r on the adapter</text>
    <text x="744" y="212" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">weight error</text>

    <text x="720" y="512" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15"
          fill="#c9d1d9">the knee is the target's rank, not the model's size</text>
    <text x="720" y="540" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15"
          fill="#8b949e">add full-rank detail and r=8 floors at 10.2%</text>
  </g>

  <text x="1150" y="604" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="15" fill="#8b949e">ml-ke.github.io</text>
</svg>
