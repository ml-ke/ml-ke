<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.02"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3.2" orient="auto">
      <path d="M0,0 L7,3.2 L0,6.4 z" fill="#6bcf7f"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.03">
    <line x1="60" y1="0" x2="60" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="540" y1="0" x2="540" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="780" y1="0" x2="780" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="330" x2="1200" y2="330"/><line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="570" x2="1200" y2="570"/>
  </g>

  <text x="60" y="48" fill="#00d2ff" font-size="15" letter-spacing="3">25 SEPTEMBER 2026</text>
  <text x="60" y="104" fill="#e6edf3" font-size="50" font-weight="bold">Prequalified</text>
  <text x="60" y="140" fill="#9fb0c0" font-size="20">WHO opens its procurement list to AI TB screening software</text>

  <rect x="790" y="34" width="350" height="40" rx="8" fill="#12283a" stroke="#00d2ff" stroke-opacity="0.6"/>
  <text x="965" y="59" fill="#00d2ff" font-size="14" text-anchor="middle">first digital health technology in WHO PQ</text>

  <!-- conveyor belt -->
  <rect x="60" y="430" width="1080" height="24" rx="12" fill="#1b2430" stroke="#2c3a4d"/>
  <g fill="#263242">
    <circle cx="110" cy="442" r="8"/><circle cx="190" cy="442" r="8"/><circle cx="270" cy="442" r="8"/>
    <circle cx="350" cy="442" r="8"/><circle cx="430" cy="442" r="8"/><circle cx="510" cy="442" r="8"/>
    <circle cx="590" cy="442" r="8"/><circle cx="670" cy="442" r="8"/><circle cx="750" cy="442" r="8"/>
    <circle cx="830" cy="442" r="8"/><circle cx="910" cy="442" r="8"/><circle cx="990" cy="442" r="8"/>
    <circle cx="1070" cy="442" r="8"/>
  </g>

  <!-- software crates, version-tagged -->
  <g>
    <rect x="130" y="292" width="150" height="136" rx="8" fill="#161d29" stroke="#2c3a4d"/>
    <rect x="150" y="314" width="110" height="76" rx="5" fill="none" stroke="#3a4a5d"/>
    <ellipse cx="182" cy="352" rx="16" ry="24" fill="none" stroke="#3a4a5d"/>
    <ellipse cx="228" cy="352" rx="16" ry="24" fill="none" stroke="#3a4a5d"/>
    <text x="205" y="416" fill="#6b7a8d" font-size="20" text-anchor="middle">v5</text>
  </g>
  <g>
    <rect x="330" y="292" width="150" height="136" rx="8" fill="#1b2430" stroke="#3a4a5d"/>
    <rect x="350" y="314" width="110" height="76" rx="5" fill="none" stroke="#4a5c72"/>
    <ellipse cx="382" cy="352" rx="16" ry="24" fill="none" stroke="#4a5c72"/>
    <ellipse cx="428" cy="352" rx="16" ry="24" fill="none" stroke="#4a5c72"/>
    <text x="405" y="416" fill="#9fb0c0" font-size="20" text-anchor="middle">v6</text>
  </g>
  <g>
    <rect x="530" y="280" width="164" height="148" rx="8" fill="#12283a" stroke="#00d2ff" stroke-width="2"/>
    <rect x="552" y="304" width="120" height="82" rx="5" fill="none" stroke="#00d2ff" stroke-opacity="0.7"/>
    <ellipse cx="588" cy="345" rx="18" ry="26" fill="none" stroke="#00d2ff" stroke-opacity="0.7"/>
    <ellipse cx="638" cy="345" rx="18" ry="26" fill="none" stroke="#00d2ff" stroke-opacity="0.7"/>
    <text x="612" y="416" fill="#00d2ff" font-size="22" font-weight="bold" text-anchor="middle">v7</text>
  </g>

  <!-- inspection arch over the newest build -->
  <path d="M500,210 L500,430 M760,210 L760,430" stroke="#00d2ff" stroke-opacity="0.55" stroke-width="4" fill="none"/>
  <path d="M500,210 L760,210" stroke="#00d2ff" stroke-opacity="0.55" stroke-width="4" fill="none"/>
  <path d="M508,214 L752,214 L690,392 L570,392 z" fill="url(#beam)"/>
  <g stroke="#00d2ff" stroke-opacity="0.35" stroke-dasharray="8 10">
    <line x1="512" y1="252" x2="748" y2="252"/>
    <line x1="524" y1="296" x2="736" y2="296"/>
    <line x1="540" y1="340" x2="720" y2="340"/>
  </g>
  <text x="630" y="192" fill="#00d2ff" font-size="15" text-anchor="middle" letter-spacing="2">INSPECTION</text>

  <!-- magnifier on the version tag -->
  <g>
    <circle cx="612" cy="398" r="36" fill="#0d1117" fill-opacity="0.6" stroke="#ffd93d" stroke-width="3"/>
    <line x1="636" y1="424" x2="664" y2="454" stroke="#ffd93d" stroke-width="7" stroke-linecap="round"/>
    <text x="612" y="404" fill="#ffd93d" font-size="16" text-anchor="middle">v7 only</text>
  </g>
  <text x="676" y="462" fill="#ffd93d" font-size="14">listing is build-specific</text>

  <!-- PQ listing card -->
  <g>
    <rect x="866" y="236" width="274" height="176" rx="10" fill="#141c28" stroke="#2c3a4d"/>
    <text x="886" y="266" fill="#6bcf7f" font-size="16" letter-spacing="2">WHO PQ LIST</text>
    <line x1="886" y1="278" x2="1120" y2="278" stroke="#2c3a4d"/>
    <text x="886" y="304" fill="#c9d6e2" font-size="15">UN agencies</text>
    <text x="886" y="330" fill="#c9d6e2" font-size="15">donors and procurement agents</text>
    <text x="886" y="356" fill="#c9d6e2" font-size="15">national ministries of health</text>
    <text x="886" y="392" fill="#6b7a8d" font-size="13">trusted guidance, not a local</text>
    <text x="886" y="410" fill="#6b7a8d" font-size="13">performance claim</text>
  </g>

  <!-- re-verify loop -->
  <path d="M866,470 C820,560 700,566 636,520" stroke="#6bcf7f" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="880" y="512" fill="#6bcf7f" font-size="15">re-verify every build</text>
  <text x="880" y="534" fill="#6b7a8d" font-size="13">pin the version, re-check the threshold</text>

  <!-- fact chips -->
  <rect x="60" y="520" width="330" height="38" rx="8" fill="#161d29" stroke="#2c3a4d"/>
  <text x="80" y="545" fill="#9fb0c0" font-size="15">target: 90% sensitivity / 70% specificity</text>
  <rect x="60" y="568" width="330" height="38" rx="8" fill="#161d29" stroke="#2c3a4d"/>
  <text x="80" y="593" fill="#9fb0c0" font-size="15">8.3M diagnosed, 2.4M missed (2024)</text>

  <text x="1140" y="608" fill="#6b7a8d" font-size="16" text-anchor="end">ml-ke.github.io</text>
</svg>
