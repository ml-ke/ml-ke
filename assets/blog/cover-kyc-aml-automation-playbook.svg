<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="belt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="0.5" stop-color="#243447"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="gateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00d2ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#00d2ff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="redGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Title -->
  <text x="600" y="62" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="bold" fill="#e6edf3">KYC/AML Automation</text>
  <text x="600" y="102" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" fill="#8b949e">The Checkpoint Playbook</text>

  <!-- Conveyor belt -->
  <rect x="60" y="430" width="1080" height="26" rx="13" fill="url(#belt)" stroke="#2d3a4d" stroke-width="1"/>
  <!-- Belt tick marks -->
  <g stroke="#3b4a5f" stroke-width="2" opacity="0.6">
    <line x1="120" y1="436" x2="120" y2="450"/><line x1="170" y1="436" x2="170" y2="450"/>
    <line x1="220" y1="436" x2="220" y2="450"/><line x1="270" y1="436" x2="270" y2="450"/>
    <line x1="320" y1="436" x2="320" y2="450"/><line x1="370" y1="436" x2="370" y2="450"/>
    <line x1="420" y1="436" x2="420" y2="450"/><line x1="470" y1="436" x2="470" y2="450"/>
    <line x1="520" y1="436" x2="520" y2="450"/><line x1="570" y1="436" x2="570" y2="450"/>
    <line x1="620" y1="436" x2="620" y2="450"/><line x1="670" y1="436" x2="670" y2="450"/>
    <line x1="720" y1="436" x2="720" y2="450"/><line x1="770" y1="436" x2="770" y2="450"/>
    <line x1="820" y1="436" x2="820" y2="450"/><line x1="870" y1="436" x2="870" y2="450"/>
    <line x1="920" y1="436" x2="920" y2="450"/><line x1="970" y1="436" x2="970" y2="450"/>
    <line x1="1020" y1="436" x2="1020" y2="450"/><line x1="1070" y1="436" x2="1070" y2="450"/>
  </g>

  <!-- Checkpoint gates: arch shapes over the belt -->
  <!-- Gate 1: Document check -->
  <g>
    <path d="M 170 430 L 170 330 Q 170 300 200 300 L 240 300 Q 270 300 270 330 L 270 430" fill="url(#gateGrad)" stroke="#00d2ff" stroke-width="2.5"/>
    <text x="220" y="280" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#00d2ff">DOC</text>
    <circle cx="220" cy="352" r="9" fill="none" stroke="#00d2ff" stroke-width="2"/>
    <path d="M 205 372 q 15 -12 30 0" fill="none" stroke="#00d2ff" stroke-width="2"/>
  </g>
  <!-- Gate 2: Liveness -->
  <g>
    <path d="M 370 430 L 370 330 Q 370 300 400 300 L 440 300 Q 470 300 470 330 L 470 430" fill="url(#gateGrad)" stroke="#6bcf7f" stroke-width="2.5"/>
    <text x="420" y="280" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#6bcf7f">LIVENESS</text>
    <circle cx="420" cy="352" r="9" fill="none" stroke="#6bcf7f" stroke-width="2"/>
    <path d="M 405 372 q 15 -12 30 0" fill="none" stroke="#6bcf7f" stroke-width="2"/>
  </g>
  <!-- Gate 3: Watchlist (red flag here) -->
  <g>
    <path d="M 570 430 L 570 330 Q 570 300 600 300 L 640 300 Q 670 300 670 330 L 670 430" fill="#ff6b6b" fill-opacity="0.08" stroke="#ff6b6b" stroke-width="3"/>
    <text x="620" y="280" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ff6b6b">WATCHLIST</text>
    <path d="M 620 322 l 0 -26" stroke="#ff6b6b" stroke-width="2.5"/>
    <path d="M 620 296 l 12 6 l -12 6 z" fill="#ff6b6b"/>
    <circle cx="620" cy="352" r="9" fill="#ff6b6b" stroke="#ff6b6b" stroke-width="2"/>
    <path d="M 605 372 q 15 -12 30 0" fill="none" stroke="#ff6b6b" stroke-width="2"/>
  </g>
  <!-- Gate 4: Monitoring -->
  <g>
    <path d="M 770 430 L 770 330 Q 770 300 800 300 L 840 300 Q 870 300 870 330 L 870 430" fill="url(#gateGrad)" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="820" y="280" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#a78bfa">MONITOR</text>
    <circle cx="820" cy="352" r="9" fill="none" stroke="#a78bfa" stroke-width="2"/>
    <path d="M 805 372 q 15 -12 30 0" fill="none" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <!-- Gate 5: Reconciliation -->
  <g>
    <path d="M 970 430 L 970 330 Q 970 300 1000 300 L 1040 300 Q 1070 300 1070 330 L 1070 430" fill="url(#gateGrad)" stroke="#ffd93d" stroke-width="2.5"/>
    <text x="1020" y="280" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="bold" fill="#ffd93d">RECON</text>
    <circle cx="1020" cy="352" r="9" fill="none" stroke="#ffd93d" stroke-width="2"/>
    <path d="M 1005 372 q 15 -12 30 0" fill="none" stroke="#ffd93d" stroke-width="2"/>
  </g>

  <!-- Documents travelling on the belt -->
  <!-- Doc A: passed (cyan) -->
  <g filter="url(#softGlow)">
    <rect x="286" y="398" width="56" height="40" rx="5" fill="#13283d" stroke="#00d2ff" stroke-width="2"/>
    <rect x="296" y="407" width="36" height="4" rx="2" fill="#00d2ff" opacity="0.7"/>
    <rect x="296" y="416" width="28" height="4" rx="2" fill="#00d2ff" opacity="0.4"/>
    <path d="M 300 430 l 5 5 l 10 -12" stroke="#6bcf7f" stroke-width="2.5" fill="none"/>
  </g>
  <!-- Doc B: passed (green) -->
  <g filter="url(#softGlow)">
    <rect x="486" y="398" width="56" height="40" rx="5" fill="#13283d" stroke="#6bcf7f" stroke-width="2"/>
    <rect x="496" y="407" width="36" height="4" rx="2" fill="#6bcf7f" opacity="0.7"/>
    <rect x="496" y="416" width="28" height="4" rx="2" fill="#6bcf7f" opacity="0.4"/>
    <path d="M 500 430 l 5 5 l 10 -12" stroke="#6bcf7f" stroke-width="2.5" fill="none"/>
  </g>
  <!-- Doc C: FLAGGED at watchlist gate (red, tilted, glow) -->
  <g filter="url(#redGlow)" transform="rotate(-8 700 418)">
    <rect x="688" y="398" width="56" height="40" rx="5" fill="#2b1216" stroke="#ff6b6b" stroke-width="2.5"/>
    <rect x="698" y="407" width="36" height="4" rx="2" fill="#ff6b6b" opacity="0.8"/>
    <rect x="698" y="416" width="28" height="4" rx="2" fill="#ff6b6b" opacity="0.5"/>
    <path d="M 700 430 l -8 -10" stroke="#ff6b6b" stroke-width="3" fill="none"/>
    <path d="M 700 430 l 10 -8" stroke="#ff6b6b" stroke-width="3" fill="none"/>
  </g>
  <!-- Doc D: passed (purple) -->
  <g filter="url(#softGlow)">
    <rect x="886" y="398" width="56" height="40" rx="5" fill="#13283d" stroke="#a78bfa" stroke-width="2"/>
    <rect x="896" y="407" width="36" height="4" rx="2" fill="#a78bfa" opacity="0.7"/>
    <rect x="896" y="416" width="28" height="4" rx="2" fill="#a78bfa" opacity="0.4"/>
    <path d="M 900 430 l 5 5 l 10 -12" stroke="#6bcf7f" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Flag label -->
  <text x="700" y="492" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ff6b6b">FLAGGED</text>

  <!-- Legend -->
  <text x="600" y="540" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#8b949e">Every checkpoint independent · none trusts the one before it</text>

  <!-- Logo -->
  <text x="1090" y="600" text-anchor="end" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" fill="#484f58">ml-ke.github.io</text>
</svg>
