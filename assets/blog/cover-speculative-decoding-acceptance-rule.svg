<text x="60" y="102" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">Speculative decoding: the acceptance rule, the speedup surface, and where it loses</text>
