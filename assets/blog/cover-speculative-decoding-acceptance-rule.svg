<text x="366" y="376" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#ff6b6b">&#10007;</text>

<rect x="440" y="314" width="120" height="42" rx="5" fill="#e6edf3" fill-opacity="0.10" stroke="#e6edf3" stroke-width="1.3"/>
<text x="456" y="341" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#e6edf3">returns</text>
<text x="440" y="376" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e">resampled from norm(max(0, p - q))</text>
<text x="60" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#c9d1d9">4 emitted: 3 accepted guesses + 1 target token</text>

<line x1="790" y1="176" x2="790" y2="404" stroke="#30363d"/>

<text x="800" y="176" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c9d1d9">acceptance identity</text>
<text x="800" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#00d2ff">beta = sum min(p(x), q(x))</text>
<text x="800" y="224" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">predicted 0.8800 &#183; measured 0.8806</text>
<text x="800" y="256" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c9d1d9">tokens per pass</text>
<text x="800" y="282" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#ffd93d">(1 - a^(g+1)) / (1 - a)</text>
<text x="800" y="304" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#8b949e">predicted 3.9356 &#183; measured 3.9387</text>
<text x="800" y="336" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c9d1d9">losslessness check</text>
<text x="800" y="362" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6bcf7f">TV 0.00144 vs 0.00552 baseline</text>
<text x="800" y="382" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#6bcf7f">chi-square 2.18, 5 dof, p = 0.824</text>
<text x="800" y="404" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#ff6b6b">or 0.93x when c = 0.50 and a = 0.40</text>

<text x="60" y="504" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" fill="#e6edf3">The sampler is provably lossless. The speedup is not: it is a property of your draft/target pair.</text>
<text x="60" y="534" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Three stdlib programs measure the acceptance identity, the gamma/cost surface, and a real draft audit - no GPU required.</text>
<text x="1010" y="606" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#8b949e">ml-ke.github.io</text>
</svg>
