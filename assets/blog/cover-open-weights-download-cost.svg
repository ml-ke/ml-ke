<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Download bar filling toward three storage tiers labelled 1060.6 gigabytes, 634.8 gigabytes and 233.0 gigabytes, with stacked disk platters">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6bcf7f"/>
      <stop offset="100%" stop-color="#00d2ff"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd93d"/>
      <stop offset="100%" stop-color="#6bcf7f"/>
    </linearGradient>
    <linearGradient id="platter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2b3350"/>
      <stop offset="100%" stop-color="#151a2c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path d="M120 0V630M240 0V630M360 0V630M480 0V630M600 0V630M720 0V630M840 0V630M960 0V630M1080 0V630"/>
  </g>

  <text x="72" y="118" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#e8ecf4">635 gigabytes of free</text>
  <text x="72" y="158" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="600" fill="#e8ecf4">what a trillion-parameter release costs to own</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <text x="72" y="228" font-size="18" fill="#8b96ad">the reference checkpoint, at one byte per parameter</text>
    <rect x="72" y="242" width="720" height="34" rx="6" fill="#0f1422" stroke="#2a3350"/>
    <rect x="72" y="242" width="720" height="34" rx="6" fill="url(#bar1)" opacity="0.9"/>
    <text x="812" y="266" font-size="22" fill="#00d2ff" font-weight="600">1,060.6 GB</text>

    <text x="72" y="330" font-size="18" fill="#8b96ad">GGUF Q4_K_M, 13 shards</text>
    <rect x="72" y="344" width="720" height="34" rx="6" fill="#0f1422" stroke="#2a3350"/>
    <rect x="72" y="344" width="431" height="34" rx="6" fill="url(#bar2)" opacity="0.9"/>
    <text x="812" y="368" font-size="22" fill="#6bcf7f" font-weight="600">634.8 GB</text>

    <text x="72" y="432" font-size="18" fill="#8b96ad">unsloth UD-IQ1_S, the smallest copy published</text>
    <rect x="72" y="446" width="720" height="34" rx="6" fill="#0f1422" stroke="#2a3350"/>
    <rect x="72" y="446" width="158" height="34" rx="6" fill="url(#bar3)" opacity="0.9"/>
    <text x="812" y="470" font-size="22" fill="#ffd93d" font-weight="600">233.0 GB</text>
  </g>

  <g opacity="0.95">
    <ellipse cx="985" cy="215" rx="118" ry="34" fill="#232a44" stroke="#3a4468"/>
    <ellipse cx="985" cy="185" rx="118" ry="34" fill="#2a3350" stroke="#3a4468"/>
    <ellipse cx="985" cy="155" rx="118" ry="34" fill="#333d60" stroke="#4a5680"/>
    <circle cx="985" cy="155" r="14" fill="#0d1117" stroke="#4a5680"/>
    <path d="M867 215v70a118 34 0 0 0 236 0v-70" fill="none" stroke="#3a4468" stroke-width="2"/>
    <path d="M867 185v30M1103 185v30" stroke="#3a4468" stroke-width="2"/>
  </g>


  <g font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8b96ad" text-anchor="middle">
    <text x="1035" y="318">one trillion parameters</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#c8d1e4">
    <text x="72" y="546">the download is free; the disk, the DRAM and the GPUs are not</text>
  </g>

  <g font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6f7a92">
    <text x="72" y="596">measured from the Hugging Face repositories, 1 November 2026</text>
  </g>

  <text x="1128" y="596" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#8b96ad">ml-ke.github.io</text>
</svg>
