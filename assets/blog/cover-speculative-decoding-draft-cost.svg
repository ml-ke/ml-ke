<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="beam" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff6b6b"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#8b949e" stroke-width="1" opacity="0.05">
    <path d="M0,90 H1200 M0,180 H1200 M0,270 H1200 M0,360 H1200 M0,450 H1200 M0,540 H1200"/>
    <path d="M100,0 V630 M300,0 V630 M500,0 V630 M700,0 V630 M900,0 V630 M1100,0 V630"/>
  </g>

  <text x="80" y="112" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#e6edf3">Who pays for the draft</text>
  <text x="80" y="158" font-family="Helvetica, Arial, sans-serif" font-size="23" fill="#8b949e">Speculative decoding: acceptance, draft length and draft cost decide the speedup</text>

  <!-- verification beam sweeping back over the draft ribbon -->
  <path d="M700,232 L230,262 L230,352 L700,382 Z" fill="url(#beam)"/>

  <!-- draft tokens: fast, cheap, one already rejected -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="middle">
    <rect x="230" y="264" width="66" height="66" rx="10" fill="#6bcf7f" fill-opacity="0.18" stroke="#6bcf7f" stroke-width="2"/>
    <text x="263" y="306" fill="#6bcf7f">t1</text>

    <rect x="312" y="264" width="66" height="66" rx="10" fill="#ff6b6b" fill-opacity="0.10" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="345" y="306" fill="#ff6b6b">t2</text>

    <rect x="394" y="264" width="66" height="66" rx="10" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5" opacity="0.55"/>
    <text x="427" y="306" fill="#8b949e" opacity="0.55">t3</text>

    <rect x="476" y="264" width="66" height="66" rx="10" fill="none" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5" opacity="0.3"/>
    <text x="509" y="306" fill="#8b949e" opacity="0.3">t4</text>
  </g>

  <!-- rejected token falls away -->
  <path d="M345,340 V400" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrow)" opacity="0.8"/>
  <text x="360" y="424" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#ff6b6b">resample from (p - q)+</text>

  <!-- label above the ribbon -->
  <text x="230" y="238" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#00d2ff" letter-spacing="2">DRAFT</text>

  <!-- target verifier -->
  <g>
    <rect x="700" y="222" width="332" height="172" rx="18" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="866" y="272" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#a78bfa" text-anchor="middle">TARGET PASS</text>
    <text x="866" y="306" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9d1d9" text-anchor="middle">verifies gamma + 1 tokens</text>
    <text x="866" y="336" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9d1d9" text-anchor="middle">costs about one target step</text>
    <text x="866" y="368" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e" text-anchor="middle">only when bandwidth bound</text>
  </g>
  <text x="700" y="212" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#a78bfa" letter-spacing="2">VERIFY</text>

  <!-- the price tag under the cheap path -->
  <g>
    <rect x="230" y="470" width="360" height="86" rx="12" fill="#00d2ff" fill-opacity="0.07" stroke="#00d2ff" stroke-width="1.5"/>
    <text x="252" y="503" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#00d2ff">alpha = 0.80   gamma = 5   c = 0.05</text>
    <text x="252" y="536" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#e6edf3">speedup 2.95x, not 3.69x</text>
  </g>

  <!-- cost ratio note -->
  <g>
    <rect x="620" y="470" width="412" height="86" rx="12" fill="#ffd93d" fill-opacity="0.07" stroke="#ffd93d" stroke-width="1.5"/>
    <text x="642" y="503" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#ffd93d">c = draft forward / target forward</text>
    <text x="642" y="536" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#c9d1d9">the number the published table sets to 0</text>
  </g>

  <text x="1120" y="600" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#6e7681" text-anchor="end">ml-ke.github.io</text>
</svg>
