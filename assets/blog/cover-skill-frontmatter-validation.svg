<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="45%" stop-color="#161b2e"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#6bcf7f"/>
      <stop offset="100%" stop-color="#ffd93d"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid -->
  <g stroke="#00d2ff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="126" x2="1200" y2="126"/>
    <line x1="0" y1="252" x2="1200" y2="252"/>
    <line x1="0" y1="378" x2="1200" y2="378"/>
    <line x1="0" y1="504" x2="1200" y2="504"/>
  </g>

  <!-- Front-matter document cards -->
  <g transform="translate(140, 120)">
    <!-- Card 1 (back) -->
    <rect x="60" y="30" width="360" height="380" rx="14" fill="#1c2333" stroke="#00d2ff" stroke-opacity="0.25"/>
    <!-- Card 2 (middle) -->
    <rect x="120" y="20" width="360" height="380" rx="14" fill="#232b40" stroke="#6bcf7f" stroke-opacity="0.35"/>
    <!-- Card 3 (front) -->
    <rect x="180" y="10" width="360" height="380" rx="14" fill="#2a3350" stroke="url(#accent)" stroke-width="2.5"/>
    <!-- YAML dashes -->
    <g stroke="#ffd93d" stroke-width="5" stroke-linecap="round">
      <line x1="220" y1="55" x2="250" y2="55"/>
      <line x1="220" y1="345" x2="250" y2="345"/>
    </g>
    <!-- Key/value lines -->
    <g stroke="#8b98b8" stroke-width="6" stroke-linecap="round">
      <line x1="220" y1="90" x2="420" y2="90"/>
      <line x1="220" y1="125" x2="380" y2="125"/>
      <line x1="220" y1="160" x2="440" y2="160"/>
      <line x1="220" y1="195" x2="350" y2="195"/>
      <line x1="220" y1="230" x2="400" y2="230"/>
      <line x1="220" y1="265" x2="360" y2="265"/>
      <line x1="220" y1="300" x2="430" y2="300"/>
    </g>
  </g>

  <!-- Validation checkmark -->
  <g transform="translate(760, 200)" filter="url(#glow)">
    <circle cx="110" cy="110" r="100" fill="none" stroke="#6bcf7f" stroke-width="10" stroke-opacity="0.3"/>
    <circle cx="110" cy="110" r="100" fill="none" stroke="#6bcf7f" stroke-width="10" stroke-dasharray="530 630" stroke-linecap="round" transform="rotate(-90 110 110)"/>
    <path d="M 60 115 L 95 150 L 165 70" fill="none" stroke="#6bcf7f" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Scan beam -->
  <g stroke="#00d2ff" stroke-opacity="0.5">
    <line x1="180" y1="505" x2="1020" y2="505" stroke-width="3"/>
    <line x1="180" y1="530" x2="1020" y2="530" stroke-width="1.5"/>
    <line x1="180" y1="555" x2="1020" y2="555" stroke-width="0.75"/>
  </g>

  <!-- Title -->
  <text x="600" y="610" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="34" font-weight="bold" fill="#e6edf3">SKILL FRONTMATTER VALIDATION AT SCALE</text>
</svg>
