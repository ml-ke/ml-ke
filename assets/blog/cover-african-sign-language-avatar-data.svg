  <text x="70" y="222" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="bold" fill="#f0f6fc">300 Deaf Students,</text>
  <text x="70" y="278" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="bold" fill="#f0f6fc">One Interpreter</text>
  <text x="70" y="322" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#9aa4b2">The corpus is the product, not the avatar</text>

