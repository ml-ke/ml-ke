  <text x="96" y="418" font-family="Helvetica, Arial, sans-serif" font-size="46" font-weight="bold" fill="#ffd93d">300 : 1</text>
  <text x="96" y="446" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">students : interpreter in the classroom where Terp 360 began</text>

  <text x="70" y="516" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#00d2ff">2,300+ signs recorded &#183; 20,000+ captured sequences</text>
  <text x="70" y="546" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#00d2ff">60% urban / 40% rural signers &#183; every sign Deaf-validated</text>
  <text x="70" y="582" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#a78bfa">3.64 GB to collect  &#8594;  0.21 GB shipped vocabulary</text>

