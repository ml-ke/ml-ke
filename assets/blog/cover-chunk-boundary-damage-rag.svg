<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A document column cut by two dashed chunk seams, one sentence line sliced in half across a seam, beside bars showing figure sentences kept whole rising from 54 percent at 400 characters to 100 percent with structure protection">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3f9e5c"/>
      <stop offset="100%" stop-color="#6bcf7f"/>
    </linearGradient>
    <linearGradient id="bad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f2f2f"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8a6d1f"/>
      <stop offset="100%" stop-color="#ffd93d"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="74" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="44" font-weight="bold" fill="#e6edf3">the chunk boundary is the bug</text>
  <text x="600" y="112" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="21" fill="#8b949e">measuring what a split does to your retrieval</text>

  <g>
    <rect x="110" y="170" width="520" height="320" rx="10" fill="#12161f" stroke="#2a2f3a" stroke-width="2"/>
    <text x="126" y="158" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15"
          fill="#8b949e">document</text>
    <text x="220" y="158" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15" fill="#ff6b6b">chunk 1</text>
    <text x="415" y="158" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15" fill="#ff6b6b">chunk 2</text>
    <text x="565" y="158" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="15" fill="#ff6b6b">chunk 3</text>

    <line x1="330" y1="170" x2="330" y2="490" stroke="#ff6b6b" stroke-width="3"
          stroke-dasharray="9 7" stroke-opacity="0.9"/>
    <line x1="500" y1="170" x2="500" y2="490" stroke="#ff6b6b" stroke-width="3"
          stroke-dasharray="9 7" stroke-opacity="0.9"/>

    <g fill="#2f3644">
      <rect x="132" y="196" width="196" height="12" rx="6"/>
      <rect x="132" y="220" width="390" height="12" rx="6"/>
      <rect x="132" y="244" width="300" height="12" rx="6"/>
      <rect x="132" y="268" width="240" height="12" rx="6"/>
      <rect x="132" y="316" width="330" height="12" rx="6"/>
      <rect x="132" y="340" width="270" height="12" rx="6"/>
      <rect x="132" y="388" width="380" height="12" rx="6"/>
      <rect x="132" y="412" width="220" height="12" rx="6"/>
      <rect x="132" y="436" width="300" height="12" rx="6"/>
    </g>

    <rect x="132" y="292" width="188" height="14" rx="7" fill="url(#bad)"/>
    <rect x="338" y="292" width="128" height="14" rx="7" fill="url(#bad)" fill-opacity="0.55"/>
    <line x1="330" y1="284" x2="330" y2="314" stroke="#e6edf3" stroke-width="2" stroke-opacity="0.35"/>
    <text x="226" y="284" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="14" fill="#ff6b6b">one fact</text>
    <text x="402" y="284" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="14" fill="#ff6b6b">two chunks</text>

    <text x="126" y="472" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14"
          fill="#8b949e">no reranker puts the halves back together</text>
  </g>

  <g>
    <text x="728" y="188" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17"
          fill="#e6edf3">figure sentences kept whole</text>
    <text x="728" y="212" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14"
          fill="#8b949e">161 posts, 3,206 evidence sentences</text>

    <text x="728" y="258" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15"
          fill="#c9d1d9">fixed 400 characters</text>
    <rect x="728" y="268" width="330" height="30" rx="6" fill="#1c212b"/>
    <rect x="728" y="268" width="178" height="30" rx="6" fill="url(#bad)"/>
    <text x="918" y="289" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17"
          font-weight="bold" fill="#ff8f8f">54.0%</text>

    <text x="728" y="332" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15"
          fill="#c9d1d9">fixed 800 characters</text>
    <rect x="728" y="342" width="330" height="30" rx="6" fill="#1c212b"/>
    <rect x="728" y="342" width="254" height="30" rx="6" fill="url(#warn)"/>
    <text x="994" y="363" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17"
          font-weight="bold" fill="#ffd93d">76.9%</text>

    <text x="728" y="406" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15"
          fill="#c9d1d9">fences and tables protected</text>
    <rect x="728" y="416" width="330" height="30" rx="6" fill="#1c212b"/>
    <rect x="728" y="416" width="330" height="30" rx="6" fill="url(#good)"/>
    <text x="1070" y="437" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
          font-size="17" font-weight="bold" fill="#0d1117">100%</text>

    <text x="728" y="480" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14"
          fill="#8b949e">answer@5: 54.5% to 97.5% on the same 200 queries</text>
  </g>

  <text x="1150" y="604" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="15" fill="#8b949e">ml-ke.github.io</text>
</svg>
