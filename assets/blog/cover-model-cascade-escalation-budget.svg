<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A funnel of incoming queries hitting a gate at the neck; most are deflected left into a cheap answer bin costing 240 dollars per million, while a thin stream falls through into a strong model chamber costing 4439 dollars per million">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="cheapFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2f26"/>
      <stop offset="100%" stop-color="#132019"/>
    </linearGradient>
    <linearGradient id="strongFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33261a"/>
      <stop offset="100%" stop-color="#231a12"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <marker id="headGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6bcf7f"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffd93d"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="70" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="42" font-weight="bold" fill="#e6edf3">the gate is the stop rule</text>
  <text x="600" y="104" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="20" fill="#8b949e">pay the big model only on the queries that need it</text>

  <text x="600" y="146" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="14" fill="#8b949e">100% of queries enter</text>

  <path d="M470 158 L560 300" stroke="#3d4757" stroke-width="3" fill="none"/>
  <path d="M730 158 L640 300" stroke="#3d4757" stroke-width="3" fill="none"/>

  <g fill="#8b949e">
    <circle cx="520" cy="180" r="5"/>
    <circle cx="568" cy="176" r="5"/>
    <circle cx="616" cy="182" r="5"/>
    <circle cx="664" cy="178" r="5"/>
    <circle cx="505" cy="216" r="5"/>
    <circle cx="553" cy="212" r="5"/>
    <circle cx="601" cy="218" r="5"/>
    <circle cx="649" cy="214" r="5"/>
    <circle cx="697" cy="220" r="5"/>
    <circle cx="562" cy="252" r="5"/>
    <circle cx="610" cy="248" r="5"/>
    <circle cx="658" cy="254" r="5"/>
    <circle cx="586" cy="286" r="5" fill="#ffd93d"/>
    <circle cx="625" cy="284" r="5" fill="#ffd93d"/>
  </g>

  <line x1="556" y1="300" x2="600" y2="300" stroke="#ff6b6b" stroke-width="7" stroke-linecap="round"/>
  <line x1="640" y1="300" x2="644" y2="300" stroke="#ff6b6b" stroke-width="7" stroke-linecap="round"/>
  <text x="600" y="330" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="13" fill="#ff6b6b">confidence below threshold</text>

  <path d="M580 312 C520 340 470 370 420 402" stroke="#6bcf7f" stroke-width="2.5" fill="none"
        stroke-dasharray="7 6" marker-end="url(#headGreen)"/>
  <path d="M622 312 C640 345 660 375 690 402" stroke="#ffd93d" stroke-width="2.5" fill="none"
        stroke-dasharray="7 6" marker-end="url(#headAmber)"/>

  <rect x="188" y="408" width="298" height="150" rx="9" fill="url(#cheapFill)" stroke="#2c4a38" stroke-width="2"/>
  <text x="337" y="440" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="bold" fill="#6bcf7f">cheap model answers</text>
  <text x="337" y="490" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="bold" fill="#e6edf3">83%</text>
  <text x="337" y="524" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="15" fill="#8b949e">$240 per million queries</text>

  <rect x="700" y="408" width="312" height="150" rx="9" fill="url(#strongFill)" stroke="#5a4426" stroke-width="2"/>
  <text x="856" y="440" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="17" font-weight="bold" fill="#ffd93d">escalated to the big model</text>
  <text x="856" y="490" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="40" font-weight="bold" fill="#e6edf3">17%</text>
  <text x="856" y="524" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="15" fill="#8b949e">$4,439 per million queries</text>

  <text x="188" y="592" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">
    the same traffic on the big model alone: $24,700 per million
  </text>
  <text x="188" y="614" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#5b6472">
    a cascade's saving is set by the rate that never escalates
  </text>

  <text x="1104" y="610" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif"
        font-size="13" fill="#4a5361">ml-ke.github.io</text>
</svg>
