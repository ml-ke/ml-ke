<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="panelL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d2433"/>
      <stop offset="100%" stop-color="#161c28"/>
    </linearGradient>
    <linearGradient id="panelR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#172a2b"/>
      <stop offset="100%" stop-color="#132022"/>
    </linearGradient>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b6b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6bcf7f"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00d2ff"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.03">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630"/>
  </g>

  <text x="60" y="72" font-size="40" font-weight="bold" fill="#e6edf3">The Retry That Charged Twice</text>
  <text x="60" y="108" font-size="19" fill="#8b949e">A timeout is an unknown, not a failure: idempotency keys and a retry budget for LLM and agent calls</text>
  <line x1="60" y1="128" x2="1140" y2="128" stroke="#30363d" stroke-width="1"/>

  <!-- left panel: no key -->
  <rect x="60" y="150" width="500" height="330" rx="10" fill="url(#panelL)" stroke="#30363d"/>
  <text x="80" y="180" font-size="15" font-weight="bold" fill="#ff6b6b" letter-spacing="1.5">NO KEY</text>
  <text x="80" y="202" font-size="12.5" fill="#8b949e">retry on timeout, same body, no operation id</text>

  <rect x="80" y="216" width="196" height="58" rx="6" fill="#21262d" stroke="#484f58"/>
  <text x="94" y="238" font-size="12.5" fill="#c9d1d9">POST /charge  KES 4,200</text>
  <text x="94" y="258" font-size="11" fill="#8b949e">attempt 1 committed, no reply</text>
  <rect x="286" y="222" width="64" height="20" rx="10" fill="#3d1f22" stroke="#ff6b6b"/>
  <text x="299" y="236" font-size="10.5" fill="#ff6b6b">timeout</text>

  <path d="M150 274 C 150 296, 150 298, 150 312" stroke="#ff6b6b" stroke-width="1.6" fill="none" marker-end="url(#arrowRed)"/>
  <path d="M206 274 C 206 336, 396 336, 396 370" stroke="#ff6b6b" stroke-width="1.6" fill="none" marker-end="url(#arrowRed)"/>

  <rect x="80" y="318" width="330" height="42" rx="5" fill="#16202a" stroke="#6b7c8f"/>
  <text x="94" y="345" font-size="12.5" fill="#c9d1d9">ledger   charge #8841   KES 4,200</text>

  <rect x="80" y="372" width="330" height="42" rx="5" fill="#2a1418" stroke="#ff6b6b"/>
  <text x="94" y="399" font-size="12.5" fill="#ffb3b3">ledger   charge #8842   KES 4,200</text>
  <text x="424" y="399" font-size="11.5" fill="#ff6b6b">dup</text>

  <text x="80" y="444" font-size="17" font-weight="bold" fill="#ff6b6b">71 extra charges per 1,000 calls</text>
  <text x="80" y="466" font-size="12" fill="#8b949e">a key minted per attempt changes nothing</text>

  <!-- right panel: keyed -->
  <rect x="640" y="150" width="500" height="330" rx="10" fill="url(#panelR)" stroke="#2c4a44"/>
  <text x="660" y="180" font-size="15" font-weight="bold" fill="#6bcf7f" letter-spacing="1.5">KEY PER OPERATION</text>
  <text x="660" y="202" font-size="12.5" fill="#8b949e">one key per logical step, reused on every attempt</text>

  <rect x="660" y="216" width="196" height="58" rx="6" fill="#21262d" stroke="#484f58"/>
  <text x="674" y="238" font-size="12.5" fill="#c9d1d9">POST /charge  KES 4,200</text>
  <text x="674" y="258" font-size="11" fill="#8b949e">attempt 1 committed, no reply</text>
  <rect x="866" y="222" width="96" height="20" rx="10" fill="#12312a" stroke="#6bcf7f"/>
  <text x="876" y="236" font-size="10" fill="#6bcf7f">idem 8f3a2c</text>

  <path d="M690 274 C 690 306, 720 318, 742 332" stroke="#6bcf7f" stroke-width="1.6" fill="none" marker-end="url(#arrowGreen)"/>
  <path d="M838 274 C 838 306, 812 318, 800 332" stroke="#00d2ff" stroke-width="1.6" fill="none" marker-end="url(#arrowCyan)"/>
  <text x="846" y="300" font-size="11" fill="#00d2ff">replay returns stored body</text>

  <rect x="660" y="336" width="330" height="42" rx="5" fill="#122a24" stroke="#6bcf7f"/>
  <text x="674" y="363" font-size="12.5" fill="#d6f5dd">ledger   charge #8841   KES 4,200</text>

  <text x="660" y="444" font-size="17" font-weight="bold" fill="#6bcf7f">1 charge · 70 answers replayed</text>
  <text x="660" y="466" font-size="12" fill="#8b949e">the retry reads the first attempt's result</text>

  <!-- backoff ladder -->
  <rect x="60" y="500" width="1080" height="58" rx="8" fill="#111826" stroke="#30363d"/>
  <text x="80" y="524" font-size="11.5" fill="#8b949e" letter-spacing="1.2">FULL JITTER · BASE 250 ms · CAP 8,000 ms</text>
  <text x="80" y="547" font-size="13" fill="#c9d1d9">250  →  500  →  1,000  →  2,000  →  4,000  →  8,000 ms</text>
  <text x="640" y="530" font-size="13.5" font-weight="bold" fill="#ffd93d">6 attempts fit inside 20 seconds</text>
  <text x="640" y="549" font-size="11.5" fill="#8b949e">raise the base to 1,000 ms and only 4 fit</text>

  <text x="1140" y="606" font-size="11" fill="#484f58" text-anchor="end">ml-ke.github.io</text>
  <text x="60" y="606" font-size="11" fill="#484f58">seeded stdlib simulation · 1,000 logical calls · duplicate side effects counted, not timed</text>
</svg>
