<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#1a1a2e"/></linearGradient>
<linearGradient id="gCyan" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#00d2ff" stop-opacity="0.25"/><stop offset="1" stop-color="#00d2ff"/></linearGradient>
<linearGradient id="gPur" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0.2"/></linearGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#ff6b6b"/></marker>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
<g stroke="#ffffff" stroke-opacity="0.035">
<line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="30" x2="1200" y2="30"/><line x1="0" y1="60" x2="1200" y2="60"/><line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="150" x2="1200" y2="150"/><line x1="0" y1="180" x2="1200" y2="180"/><line x1="0" y1="210" x2="1200" y2="210"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="270" x2="1200" y2="270"/><line x1="0" y1="300" x2="1200" y2="300"/><line x1="0" y1="330" x2="1200" y2="330"/><line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="390" x2="1200" y2="390"/><line x1="0" y1="420" x2="1200" y2="420"/><line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="510" x2="1200" y2="510"/><line x1="0" y1="540" x2="1200" y2="540"/><line x1="0" y1="570" x2="1200" y2="570"/><line x1="0" y1="600" x2="1200" y2="600"/><line x1="0" y1="630" x2="1200" y2="630"/>
</g>
<text x="56" y="70" fill="#e8eefc" font-size="39" font-family="Helvetica,Arial,sans-serif" font-weight="bold">Inconsistent by Construction</text>
<text x="56" y="102" fill="#8fa3c8" font-size="18" font-family="Helvetica,Arial,sans-serif">Greedy decoding, the repetition collapse it is allowed to produce, and a guard that costs one pass</text>

<!-- the stuck record -->
<g fill="none" stroke="#2a3550" stroke-width="1.2">
<circle cx="238" cy="356" r="140"/><circle cx="238" cy="356" r="124"/><circle cx="238" cy="356" r="108"/>
<circle cx="238" cy="356" r="92"/><circle cx="238" cy="356" r="60"/><circle cx="238" cy="356" r="44"/><circle cx="238" cy="356" r="28"/>
</g>
<circle cx="238" cy="356" r="76" fill="none" stroke="#ff6b6b" stroke-width="2.6"/>
<circle cx="238" cy="356" r="28" fill="#101a2e" stroke="#2a3550"/>
<text x="238" y="352" fill="#8fa3c8" font-size="10.5" font-family="monospace" text-anchor="middle">ONE</text>
<text x="238" y="366" fill="#8fa3c8" font-size="10.5" font-family="monospace" text-anchor="middle">GROOVE</text>
<circle cx="352" cy="176" r="11" fill="#101a2e" stroke="#8fa3c8"/>
<line x1="352" y1="176" x2="262" y2="298" stroke="#e8eefc" stroke-width="3.4"/>
<line x1="262" y1="298" x2="252" y2="322" stroke="#ff6b6b" stroke-width="4"/>
<path d="M 252 322 L 246 352" stroke="#ff6b6b" stroke-width="2.4"/>
<text x="368" y="172" fill="#ff6b6b" font-size="12.5" font-family="monospace">NEEDLE STUCK</text>
<text x="368" y="190" fill="#8fa3c8" font-size="11.5" font-family="monospace">nothing lifts it out</text>
<text x="56" y="596" fill="#8fa3c8" font-size="12.5" font-family="monospace">the incident: &#34; shame&#34; &#215; 2,537 = 15,222 bytes, zero tool calls, cap ends it</text>

<!-- the token lane -->
<g font-family="monospace" font-size="13">
<rect x="430" y="278" width="62" height="42" rx="7" fill="#101a2e" stroke="#2a3550"/><text x="461" y="304" fill="#e8eefc" text-anchor="middle">&#39; k&#39;</text>
<rect x="498" y="278" width="62" height="42" rx="7" fill="#101a2e" stroke="#2a3550"/><text x="529" y="304" fill="#e8eefc" text-anchor="middle">&#39;azi&#39;</text>
<rect x="566" y="278" width="62" height="42" rx="7" fill="#101a2e" stroke="#2a3550"/><text x="597" y="304" fill="#e8eefc" text-anchor="middle">&#39; ya&#39;</text>
<rect x="634" y="278" width="62" height="42" rx="7" fill="#101a2e" stroke="#2a3550"/><text x="665" y="304" fill="#e8eefc" text-anchor="middle">&#39; k&#39;</text>
<rect x="702" y="278" width="62" height="42" rx="7" fill="#101a2e" stroke="#2a3550"/><text x="733" y="304" fill="#e8eefc" text-anchor="middle">&#39;uf&#39;</text>
<rect x="770" y="278" width="62" height="42" rx="7" fill="#ff6b6b" fill-opacity="0.12" stroke="#ff6b6b"/><text x="801" y="304" fill="#ff6b6b" text-anchor="middle">&#39;anya&#39;</text>
</g>
<path d="M 796 268 C 796 216, 456 216, 456 268" fill="none" stroke="#ff6b6b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="560" y="206" fill="#ff6b6b" font-size="12.5" font-family="monospace" text-anchor="middle">reproduced: 6-token span &#215; 41 = 246 tokens, no EOS</text>
<rect x="430" y="336" width="402" height="30" rx="6" fill="#ff6b6b" fill-opacity="0.07" stroke="#ff6b6b" stroke-opacity="0.45" stroke-dasharray="5 4"/>
<text x="446" y="356" fill="#ff6b6b" font-size="12.5" font-family="monospace">{&#34;tool&#34;...}: 0.05 bits left, so never emitted</text>
<text x="430" y="392" fill="#8fa3c8" font-size="12" font-family="monospace">greedy, temp 0, top-k 1, repeat penalty 1.0 (disabled)</text>

<!-- the meter panel -->
<g font-family="monospace">
<rect x="856" y="196" width="288" height="286" rx="10" fill="#101a2e" stroke="#2a3550"/>
<text x="874" y="224" fill="#8fa3c8" font-size="12">WHAT THE SAMPLER BELIEVED</text>
<text x="874" y="256" fill="#e8eefc" font-size="11.5">p(top-1) for the token it chose</text>
<rect x="874" y="264" width="44" height="11" rx="3" fill="url(#gCyan)"/>
<text x="926" y="274" fill="#8fa3c8" font-size="11.5">0.291 first</text>
<rect x="874" y="282" width="238" height="11" rx="3" fill="url(#gCyan)"/>
<text x="874" y="310" fill="#00d2ff" font-size="11.5">0.994 last — the model is sure</text>
<text x="874" y="340" fill="#e8eefc" font-size="11.5">truncated top-20 entropy</text>
<rect x="874" y="348" width="238" height="11" rx="3" fill="url(#gPur)"/>
<text x="874" y="376" fill="#a78bfa" font-size="11.5">3.13 &#8594; 0.05 bits</text>
<text x="874" y="404" fill="#8fa3c8" font-size="11.5">distinct token ids: 9 of 256 (0.035)</text>
<text x="874" y="424" fill="#8fa3c8" font-size="11.5">byte-identical on rerun (deterministic)</text>
<text x="874" y="452" fill="#6bcf7f" font-size="11.5">alarm fires at token 20 of 2,537</text>
<text x="874" y="470" fill="#8fa3c8" font-size="11">periodicity watch: from the token stream</text>
</g>
<text x="1144" y="604" fill="#5b6b8c" font-size="13" font-family="monospace" text-anchor="end">ml-ke.github.io</text>
</svg>
