<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="laserGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b6b" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff6b6b" stop-opacity="0"/>
    </linearGradient>
    <marker id="arrowAI" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <text x="600" y="58" text-anchor="middle" font-family="sans-serif" font-size="33" font-weight="bold" fill="#f0f6fc">The Lab Partner That Never Sleeps</text>
  <text x="600" y="92" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#8b949e">How AI now designs physics experiments — Nature 657, 47-58 (2026)</text>

  <!-- Optical table -->
  <rect x="50" y="140" width="660" height="330" rx="10" fill="#11161f" stroke="#00d2ff" stroke-opacity="0.35" stroke-width="2"/>
  <g fill="#ffffff" fill-opacity="0.12">
    <circle cx="70" cy="160" r="3"/><circle cx="150" cy="160" r="3"/><circle cx="230" cy="160" r="3"/><circle cx="310" cy="160" r="3"/><circle cx="390" cy="160" r="3"/><circle cx="470" cy="160" r="3"/><circle cx="550" cy="160" r="3"/><circle cx="630" cy="160" r="3"/><circle cx="690" cy="160" r="3"/>
    <circle cx="70" cy="230" r="3"/><circle cx="150" cy="230" r="3"/><circle cx="230" cy="230" r="3"/><circle cx="310" cy="230" r="3"/><circle cx="390" cy="230" r="3"/><circle cx="470" cy="230" r="3"/><circle cx="550" cy="230" r="3"/><circle cx="630" cy="230" r="3"/><circle cx="690" cy="230" r="3"/>
    <circle cx="70" cy="370" r="3"/><circle cx="150" cy="370" r="3"/><circle cx="230" cy="370" r="3"/><circle cx="310" cy="370" r="3"/><circle cx="390" cy="370" r="3"/><circle cx="470" cy="370" r="3"/><circle cx="550" cy="370" r="3"/><circle cx="630" cy="370" r="3"/><circle cx="690" cy="370" r="3"/>
    <circle cx="70" cy="440" r="3"/><circle cx="150" cy="440" r="3"/><circle cx="230" cy="440" r="3"/><circle cx="310" cy="440" r="3"/><circle cx="390" cy="440" r="3"/><circle cx="470" cy="440" r="3"/><circle cx="550" cy="440" r="3"/><circle cx="630" cy="440" r="3"/><circle cx="690" cy="440" r="3"/>
  </g>
  <text x="66" y="178" font-family="monospace" font-size="12" fill="#8b949e">OPTICAL TABLE</text>

  <!-- Laser source -->
  <rect x="70" y="286" width="70" height="34" rx="5" fill="#1f2430" stroke="#ff6b6b" stroke-width="2"/>
  <text x="105" y="308" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#ff6b6b">LASER</text>
  <rect x="140" y="296" width="90" height="14" fill="url(#laserGlow)"/>

  <!-- Conventional path: splitter then phase then detector -->
  <line x1="230" y1="303" x2="420" y2="303" stroke="#00d2ff" stroke-width="4"/>
  <g transform="rotate(45 420 303)">
    <rect x="401" y="288" width="38" height="30" rx="3" fill="#00d2ff" fill-opacity="0.18" stroke="#00d2ff" stroke-width="2"/>
  </g>
  <text x="420" y="352" text-anchor="middle" font-family="monospace" font-size="11" fill="#00d2ff">BS45</text>
  <line x1="420" y1="288" x2="420" y2="200" stroke="#00d2ff" stroke-width="4"/>
  <g transform="rotate(45 420 200)">
    <rect x="404" y="188" width="32" height="24" rx="3" fill="#1f2430" stroke="#00d2ff" stroke-width="2"/>
  </g>
  <line x1="432" y1="200" x2="600" y2="200" stroke="#00d2ff" stroke-width="4"/>
  <rect x="600" y="184" width="60" height="32" rx="5" fill="#1f2430" stroke="#6bcf7f" stroke-width="2"/>
  <text x="630" y="205" text-anchor="middle" font-family="monospace" font-size="12" font-weight="bold" fill="#6bcf7f">DET</text>
  <text x="470" y="176" font-family="monospace" font-size="12" fill="#8b949e">conventional layout - fidelity 0.683</text>

  <!-- AI-proposed path: four phase plates and a different splitter, dashed -->
  <line x1="230" y1="303" x2="640" y2="420" stroke="#a78bfa" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#arrowAI)"/>
  <g fill="#a78bfa" fill-opacity="0.16" stroke="#a78bfa" stroke-width="2">
    <rect x="286" y="316" width="14" height="38" rx="3" transform="rotate(28 293 335)"/>
    <rect x="360" y="349" width="14" height="38" rx="3" transform="rotate(28 367 368)"/>
    <rect x="434" y="382" width="14" height="38" rx="3" transform="rotate(28 441 401)"/>
    <rect x="508" y="415" width="14" height="38" rx="3" transform="rotate(28 515 434)"/>
  </g>
  <g fill="#a78bfa" font-family="monospace" font-size="10" text-anchor="middle">
    <text x="296" y="312">PS90</text><text x="370" y="345">PS90</text><text x="444" y="378">PS90</text><text x="518" y="411">PS45</text>
  </g>
  <text x="336" y="470" font-family="monospace" font-size="13" font-weight="bold" fill="#a78bfa">AI-proposed path - fidelity 0.982963</text>

  <!-- Search space panel -->
  <rect x="740" y="140" width="410" height="330" rx="10" fill="#11161f" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="2"/>
  <text x="762" y="172" font-family="monospace" font-size="13" font-weight="bold" fill="#f0f6fc">SEARCH SPACE</text>
  <text x="762" y="192" font-family="monospace" font-size="12" fill="#8b949e">5 part types x 6 slots = 15,625 layouts</text>

  <text x="762" y="232" font-family="monospace" font-size="12" fill="#8b949e">median layout</text>
  <rect x="762" y="240" width="52" height="12" rx="3" fill="#8b949e" fill-opacity="0.45"/>
  <text x="824" y="251" font-family="monospace" font-size="12" fill="#8b949e">0.3536</text>

  <text x="762" y="288" font-family="monospace" font-size="12" fill="#00d2ff">conventional layout</text>
  <rect x="762" y="296" width="100" height="12" rx="3" fill="#00d2ff"/>
  <text x="872" y="307" font-family="monospace" font-size="12" fill="#00d2ff">0.6830</text>

  <text x="762" y="344" font-family="monospace" font-size="12" fill="#6bcf7f">best design found</text>
  <rect x="762" y="352" width="144" height="12" rx="3" fill="#6bcf7f"/>
  <text x="916" y="363" font-family="monospace" font-size="12" fill="#6bcf7f">0.982963</text>

  <text x="762" y="400" font-family="monospace" font-size="12" fill="#ffd93d">designs tied at best</text>
  <text x="990" y="400" font-family="monospace" font-size="14" font-weight="bold" fill="#ffd93d" text-anchor="end">27</text>
  <text x="762" y="424" font-family="monospace" font-size="12" fill="#ffd93d">layouts above 0.95</text>
  <text x="990" y="424" font-family="monospace" font-size="14" font-weight="bold" fill="#ffd93d" text-anchor="end">115</text>
  <text x="762" y="452" font-family="monospace" font-size="11" fill="#8b949e">the machine returns a shape nobody wrote down</text>

  <text x="600" y="530" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#8b949e">search space · trusted simulator · computable objective · exploration</text>
  <text x="600" y="560" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#6bcf7f">already at work in electron microscopy, fusion, particle detectors and gravitational-wave labs</text>
  <text x="1150" y="602" text-anchor="end" font-family="sans-serif" font-size="15" fill="#8b949e">ml-ke.github.io</text>
</svg>
