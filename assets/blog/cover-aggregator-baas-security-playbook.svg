<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#ff6b6b"/>
    </marker>
    <marker id="arrCyan" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#00d2ff"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Title -->
  <text x="80" y="80" font-size="46" font-weight="700" fill="#f0f6fc">The Middleman Problem</text>
  <text x="80" y="116" font-size="21" fill="#8b949e">Securing aggregator and BaaS integrations</text>

  <!-- Money rail segments (hidden inside the middle box) -->
  <line x1="324" y1="300" x2="420" y2="300" stroke="#00d2ff" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrCyan)"/>
  <line x1="778" y1="300" x2="870" y2="300" stroke="#00d2ff" stroke-width="3" stroke-dasharray="7 5" marker-end="url(#arrCyan)"/>

  <!-- Column 1: YOUR APP -->
  <rect x="70" y="185" width="250" height="210" rx="14" fill="#6bcf7f" fill-opacity="0.07" stroke="#6bcf7f" stroke-width="2.5"/>
  <text x="100" y="228" font-size="22" font-weight="700" fill="#6bcf7f">YOUR APP</text>
  <circle cx="252" cy="215" r="13" fill="none" stroke="#6bcf7f" stroke-width="2"/>
  <text x="252" y="222" font-size="15" fill="#6bcf7f" text-anchor="middle">✓</text>
  <text x="100" y="262" font-size="14" fill="#8b949e">the only layer you audit</text>
  <text x="100" y="300" font-size="13" fill="#6bcf7f">✓ HMAC-check every message</text>
  <text x="100" y="322" font-size="13" fill="#6bcf7f">✓ reconcile vs statements</text>

  <!-- Column 2: AGGREGATOR / BaaS black box -->
  <rect x="430" y="170" width="340" height="260" rx="14" fill="#161b22" stroke="#ff6b6b" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="600" y="212" font-size="21" font-weight="700" fill="#f0f6fc" text-anchor="middle">AGGREGATOR / BaaS</text>
  <text x="600" y="362" font-size="100" font-weight="700" fill="#ff6b6b" text-anchor="middle">?</text>
  <text x="600" y="405" font-size="13" fill="#ff6b6b" text-anchor="middle">you cannot see inside</text>

  <!-- Breach arrows into the box -->
  <line x1="525" y1="138" x2="525" y2="167" stroke="#ff6b6b" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <line x1="680" y1="138" x2="680" y2="167" stroke="#ff6b6b" stroke-width="2.5" marker-end="url(#arrRed)"/>
  <text x="525" y="130" font-size="12" fill="#ff6b6b" text-anchor="middle">phishing click</text>
  <text x="680" y="130" font-size="12" fill="#ff6b6b" text-anchor="middle">unrecycled key</text>

  <!-- Column 3: BANK / RAIL -->
  <rect x="880" y="185" width="250" height="210" rx="14" fill="#8b949e" fill-opacity="0.06" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1005" y="228" font-size="21" font-weight="700" fill="#8b949e" text-anchor="middle">BANK / RAIL</text>
  <text x="1005" y="256" font-size="13" fill="#6e7681" text-anchor="middle">the regulated core</text>
  <rect x="993" y="316" width="24" height="20" rx="3" fill="none" stroke="#8b949e" stroke-width="2"/>
  <path d="M 999 316 v -8 a 6 6 0 0 1 12 0 v 8" fill="none" stroke="#8b949e" stroke-width="2.5"/>
  <text x="1005" y="368" font-size="12" fill="#6e7681" text-anchor="middle">out of your reach</text>

  <!-- Bottom control chips -->
  <rect x="70" y="470" width="330" height="80" rx="12" fill="#6bcf7f" fill-opacity="0.08" stroke="#6bcf7f" stroke-width="1.5"/>
  <text x="95" y="503" font-size="17" font-weight="700" fill="#6bcf7f">VERIFY THE EDGES</text>
  <text x="95" y="528" font-size="13" fill="#8b949e">HMAC-check webhooks before crediting</text>
  <circle cx="352" cy="510" r="14" fill="none" stroke="#6bcf7f" stroke-width="2"/>
  <text x="352" y="517" font-size="16" fill="#6bcf7f" text-anchor="middle">✓</text>

  <rect x="800" y="470" width="330" height="80" rx="12" fill="#00d2ff" fill-opacity="0.07" stroke="#00d2ff" stroke-width="1.5"/>
  <text x="826" y="503" font-size="17" font-weight="700" fill="#00d2ff">RECONCILE THE MIDDLE</text>
  <text x="826" y="528" font-size="13" fill="#8b949e">diff your ledger vs the vendor daily</text>
  <circle cx="1104" cy="510" r="14" fill="none" stroke="#00d2ff" stroke-width="2"/>
  <text x="1104" y="517" font-size="16" fill="#00d2ff" text-anchor="middle">Δ</text>

  <!-- Logo -->
  <text x="1120" y="600" font-size="15" fill="#6e7681" text-anchor="end">ml-ke.github.io</text>
</svg>
