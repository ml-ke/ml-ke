<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd93d" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff6b6b" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="70" y="80" fill="#f3f6fa" font-size="40" font-weight="bold">Three Rules and a Ballot Box</text>
  <text x="70" y="116" fill="#9aa7b8" font-size="20">Auditing labeling functions before you train on their votes</text>

  <text x="70" y="164" fill="#6bcf7f" font-size="13" letter-spacing="2">EIGHT KEYWORD RULES, ONE LABEL MATRIX</text>

  <!-- ================= rule cards ================= -->
  <g>
    <path d="M70 180 L410 180 L410 256 L70 256 Z" fill="#111827" stroke="#243044"/>
    <path d="M410 180 L410 256 L380 256 L380 180 Z" fill="#0b1220" stroke="#243044"/>
    <text x="88" y="206" fill="#cbd5e1" font-size="15" font-weight="bold">L2_money_back</text>
    <text x="88" y="226" fill="#00d2ff" font-size="12" font-family="Courier, monospace">"money back" | "return"</text>
    <rect x="88" y="236" width="150" height="6" rx="3" fill="#1f2b3d"/>
    <rect x="88" y="236" width="66" height="6" rx="3" fill="#ffd93d"/>
    <text x="248" y="243" fill="#8b98a9" font-size="11">covers 0.44</text>
  </g>

  <g>
    <path d="M70 268 L410 268 L410 344 L70 344 Z" fill="#111827" stroke="#243044"/>
    <path d="M410 268 L410 344 L380 344 L380 268 Z" fill="#0b1220" stroke="#243044"/>
    <text x="88" y="294" fill="#cbd5e1" font-size="15" font-weight="bold">L3_return</text>
    <text x="88" y="314" fill="#00d2ff" font-size="12" font-family="Courier, monospace">"return" | "send it back"</text>
    <rect x="88" y="324" width="150" height="6" rx="3" fill="#1f2b3d"/>
    <rect x="88" y="324" width="55" height="6" rx="3" fill="#ffd93d"/>
    <text x="248" y="331" fill="#8b98a9" font-size="11">covers 0.37</text>
  </g>

  <g>
    <path d="M70 356 L410 356 L410 432 L70 432 Z" fill="#111827" stroke="#243044"/>
    <path d="M410 356 L410 432 L380 432 L380 356 Z" fill="#0b1220" stroke="#243044"/>
    <text x="88" y="382" fill="#cbd5e1" font-size="15" font-weight="bold">L4_double_charge</text>
    <text x="88" y="402" fill="#00d2ff" font-size="12" font-family="Courier, monospace">"charged twice"</text>
    <text x="88" y="422" fill="#ff6b6b" font-size="12">accuracy 0.317, worse than chance</text>
  </g>

  <!-- ================= shared-token link ================= -->
  <g>
    <rect x="424" y="210" width="44" height="22" rx="4" fill="#132a1c" stroke="#6bcf7f"/>
    <text x="446" y="226" fill="#6bcf7f" font-size="13" text-anchor="middle">+1</text>
    <rect x="424" y="298" width="44" height="22" rx="4" fill="#132a1c" stroke="#6bcf7f"/>
    <text x="446" y="314" fill="#6bcf7f" font-size="13" text-anchor="middle">+1</text>
    <line x1="446" y1="232" x2="446" y2="296" stroke="#00d2ff" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="446" cy="264" r="3" fill="#00d2ff"/>
    <text x="416" y="268" fill="#00d2ff" font-size="10" text-anchor="end">same token</text>
    <rect x="424" y="382" width="44" height="22" rx="4" fill="#2a1416" stroke="#ff6b6b"/>
    <text x="446" y="398" fill="#ff6b6b" font-size="13" text-anchor="middle">-1</text>
  </g>

  <!-- ================= ballot box ================= -->
  <g>
    <path d="M492 322 L660 322 L660 462 L492 462 Z" fill="#0f1622" stroke="#2b3a52" stroke-width="2"/>
    <path d="M492 322 L660 322 L642 292 L510 292 Z" fill="#131c2b" stroke="#2b3a52" stroke-width="2"/>
    <rect x="541" y="330" width="70" height="9" rx="4" fill="#05080d" stroke="#2b3a52"/>
    <text x="576" y="418" fill="#8b98a9" font-size="12" text-anchor="middle" letter-spacing="3">LABEL</text>
    <text x="576" y="438" fill="#8b98a9" font-size="12" text-anchor="middle" letter-spacing="3">MATRIX</text>
  </g>

  <!-- ================= audit panel ================= -->
  <g>
    <rect x="692" y="164" width="438" height="300" rx="10" fill="#0e1520" stroke="#243044"/>
    <text x="714" y="194" fill="#6bcf7f" font-size="13" letter-spacing="2">THE AUDIT</text>

    <text x="714" y="228" fill="#8b98a9" font-size="13">coverage of the vote</text>
    <text x="1108" y="228" fill="#f3f6fa" font-size="15" text-anchor="end">0.61</text>
    <rect x="714" y="236" width="394" height="6" rx="3" fill="#1f2b3d"/>
    <rect x="714" y="236" width="240" height="6" rx="3" fill="#00d2ff"/>

    <text x="714" y="278" fill="#8b98a9" font-size="13">unanimous rows</text>
    <text x="1108" y="278" fill="#6bcf7f" font-size="15" text-anchor="end">0.910</text>
    <text x="714" y="304" fill="#8b98a9" font-size="13">conflicted rows</text>
    <text x="1108" y="304" fill="#ffd93d" font-size="15" text-anchor="end">0.746</text>

    <text x="714" y="344" fill="#8b98a9" font-size="13">joint error, shared token</text>
    <text x="1108" y="344" fill="#ff6b6b" font-size="15" text-anchor="end">2.54x</text>
    <text x="714" y="364" fill="#6d7a8b" font-size="11">against the independent product</text>

    <text x="714" y="402" fill="#8b98a9" font-size="13">120 gold rows, counting</text>
    <text x="1108" y="402" fill="#f3f6fa" font-size="15" text-anchor="end">0.842</text>
    <text x="714" y="426" fill="#8b98a9" font-size="13">120 gold rows, weighted</text>
    <text x="1108" y="426" fill="#ff6b6b" font-size="15" text-anchor="end">0.812</text>
    <rect x="714" y="440" width="394" height="5" rx="2" fill="url(#gold)"/>
  </g>

  <!-- ================= gold sample callout ================= -->
  <g>
    <rect x="70" y="458" width="360" height="78" rx="8" fill="#0e1520" stroke="#243044"/>
    <text x="90" y="486" fill="#ffd93d" font-size="12" letter-spacing="2">600 GOLD TICKETS LATER</text>
    <text x="90" y="512" fill="#f3f6fa" font-size="17" font-weight="bold">weighted 0.849 beats counting</text>
  </g>

  <text x="1130" y="600" fill="#4b5563" font-size="14" text-anchor="end">ml-ke.github.io</text>
</svg>
