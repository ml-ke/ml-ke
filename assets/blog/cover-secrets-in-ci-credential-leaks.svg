<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="pool" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b6b" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff6b6b" stop-opacity="0.65"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <text x="600" y="62" text-anchor="middle" font-family="sans-serif" font-size="33" font-weight="bold" fill="#f0f6fc">Secrets in CI</text>
  <text x="600" y="96" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#8b949e">Credential leaks &amp; the push protection fix</text>

  <!-- CI pipeline: 3 stages with arrows -->
  <g>
    <rect x="190" y="150" width="180" height="56" rx="10" fill="#0d1117" stroke="#00d2ff" stroke-width="2.5"/>
    <text x="280" y="184" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#00d2ff">COMMIT</text>
    <path d="M380 178 L440 178" stroke="#8b949e" stroke-width="3" marker-end="url(#none)"/>
    <polygon points="440,172 454,178 440,184" fill="#8b949e"/>
    <rect x="460" y="150" width="180" height="56" rx="10" fill="#0d1117" stroke="#ffd93d" stroke-width="2.5"/>
    <text x="550" y="184" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#ffd93d">BUILD</text>
    <polygon points="650,172 664,178 650,184" fill="#8b949e"/>
    <rect x="670" y="150" width="180" height="56" rx="10" fill="#0d1117" stroke="#6bcf7f" stroke-width="2.5"/>
    <text x="760" y="184" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#6bcf7f">DEPLOY</text>
  </g>

  <!-- Crack under BUILD stage -->
  <path d="M505 206 L525 226 L515 246 L538 268" stroke="#ff6b6b" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Golden key falling through the crack, tilted -->
  <g transform="rotate(28 565 340)">
    <circle cx="565" cy="300" r="26" fill="#0d1117" stroke="#ffd93d" stroke-width="5"/>
    <circle cx="565" cy="300" r="11" fill="#0d1117"/>
    <rect x="556" y="322" width="18" height="52" rx="4" fill="#ffd93d"/>
    <rect x="556" y="366" width="10" height="14" rx="3" fill="#ffd93d"/>
    <rect x="571" y="358" width="10" height="14" rx="3" fill="#ffd93d"/>
  </g>
  <!-- motion lines above key -->
  <g stroke="#8b949e" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
    <line x1="520" y1="280" x2="520" y2="262"/>
    <line x1="545" y1="272" x2="545" y2="252"/>
    <line x1="600" y1="276" x2="600" y2="258"/>
  </g>

  <!-- Red leak droplets -->
  <g fill="#ff6b6b">
    <circle cx="540" cy="330" r="6"/>
    <circle cx="588" cy="352" r="8"/>
    <circle cx="526" cy="384" r="5"/>
    <circle cx="570" cy="404" r="7"/>
    <circle cx="612" cy="392" r="5"/>
    <circle cx="552" cy="432" r="6"/>
  </g>

  <!-- Exposed pool -->
  <rect x="440" y="478" width="260" height="54" rx="12" fill="url(#pool)" stroke="#ff6b6b" stroke-width="2.5"/>
  <text x="570" y="512" text-anchor="middle" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ff6b6b">EXPOSED</text>

  <!-- Green push-protection shield -->
  <g>
    <path d="M905 280 L965 305 L965 375 Q965 425 935 452 Q920 462 905 452 Q875 425 875 375 L875 305 Z" fill="#0d1117" stroke="#6bcf7f" stroke-width="4"/>
    <path d="M905 320 L930 330 L935 355" stroke="#6bcf7f" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="905" y1="392" x2="935" y2="392" stroke="#6bcf7f" stroke-width="3"/>
    <line x1="905" y1="406" x2="925" y2="406" stroke="#6bcf7f" stroke-width="3" opacity="0.6"/>
    <line x1="905" y1="418" x2="916" y2="418" stroke="#6bcf7f" stroke-width="3" opacity="0.35"/>
  </g>
  <text x="920" y="500" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6bcf7f">PUSH PROTECTION</text>

  <text x="1080" y="606" text-anchor="end" font-family="sans-serif" font-size="14" fill="#8b949e">ml-ke.github.io</text>
</svg>
