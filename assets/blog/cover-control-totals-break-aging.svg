<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#131a2a"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6bcf7f" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6bcf7f" stop-opacity="0.95"/>
    </linearGradient>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#6bcf7f"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff6b6b"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#6bcf7f" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M120 0 V630 M240 0 V630 M360 0 V630 M480 0 V630 M600 0 V630 M720 0 V630 M840 0 V630 M960 0 V630 M1080 0 V630"/>
  </g>

  <text x="60" y="72" fill="#f0f6fc" font-size="34" font-weight="bold">The Four Numbers Before the Ledger</text>
  <text x="60" y="104" fill="#8b949e" font-size="18">Control totals gate the batch; break aging gates the write-off — completeness is not correctness</text>

  <!-- batch stack + honest trailer -->
  <text x="60" y="152" fill="#a78bfa" font-size="14" font-weight="bold" letter-spacing="1.5">THE SENDER'S FILE</text>
  <g fill="#161b22" stroke="#00d2ff" stroke-opacity="0.55">
    <rect x="60" y="168" width="250" height="42" rx="6"/>
    <rect x="60" y="218" width="250" height="42" rx="6"/>
    <rect x="60" y="268" width="250" height="42" rx="6"/>
  </g>
  <g fill="#8b949e" font-size="14">
    <text x="76" y="195">BATCH 1 · 191 ENTRIES</text>
    <text x="76" y="245">BATCH 2 · 204 ENTRIES</text>
    <text x="76" y="295">BATCH 3 · 187 ENTRIES</text>
  </g>
  <rect x="60" y="322" width="250" height="42" rx="6" fill="#161b22" stroke="#ffd93d" stroke-opacity="0.85"/>
  <text x="76" y="349" fill="#ffd93d" font-size="14" font-weight="bold">TRAILER RECORD (THE WITNESS)</text>
  <text x="76" y="382" fill="#e6edf3" font-size="13">N = 1,170   HASH = 4,862,209,760</text>
  <text x="76" y="404" fill="#e6edf3" font-size="13">DR 5,759,092,508 = CR 5,759,092,508</text>
  <text x="76" y="432" fill="#8b949e" font-size="12">count · hash · debit total · credit total</text>

  <path d="M310 340 H355" stroke="#00d2ff" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- control gate -->
  <polygon points="440,215 505,252 505,326 440,363 375,326 375,252" fill="#121a24" stroke="#6bcf7f" stroke-width="3"/>
  <text x="440" y="282" fill="#6bcf7f" font-size="19" font-weight="bold" text-anchor="middle">CONTROL</text>
  <text x="440" y="306" fill="#6bcf7f" font-size="19" font-weight="bold" text-anchor="middle">GATE</text>

  <path d="M505 289 H560" stroke="url(#rail)" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <g fill="#6bcf7f" font-size="14">
    <text x="570" y="250">✓ COUNT 1,170</text>
    <text x="570" y="276">✓ HASH MATCHES</text>
    <text x="570" y="302">✓ DR == CR</text>
    <text x="570" y="328">✓ SEQUENCE 1..6</text>
  </g>
  <path d="M440 363 V440 H640" stroke="#6bcf7f" stroke-width="4" fill="none" marker-end="url(#arrowGreen)"/>
  <text x="655" y="432" fill="#6bcf7f" font-size="16" font-weight="bold">POST</text>
  <path d="M400 363 L352 470" stroke="#ff6b6b" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text x="150" y="490" fill="#ff6b6b" font-size="16" font-weight="bold">DO NOT POST</text>
  <text x="150" y="511" fill="#8b949e" font-size="12">truncated · replayed · altered · unbalanced</text>

  <!-- break aging ladder -->
  <line x1="640" y1="130" x2="640" y2="392" stroke="#ffd93d" stroke-opacity="0.3" stroke-width="2"/>
  <text x="672" y="152" fill="#ffd93d" font-size="14" font-weight="bold" letter-spacing="1.5">BREAK AGING — WHAT SURVIVES THE GATE</text>
  <g font-size="14" fill="#e6edf3" text-anchor="end">
    <text x="880" y="200">&lt; 1 DAY</text>
    <text x="880" y="252">1-7 DAYS</text>
    <text x="880" y="304">8-30 DAYS</text>
    <text x="880" y="356">&gt; 30 DAYS</text>
  </g>
  <rect x="900" y="182" width="175" height="24" rx="4" fill="#6bcf7f" fill-opacity="0.75"/>
  <rect x="900" y="234" width="92" height="24" rx="4" fill="#00d2ff" fill-opacity="0.75"/>
  <rect x="900" y="286" width="40" height="24" rx="4" fill="#ffd93d" fill-opacity="0.8"/>
  <rect x="900" y="338" width="26" height="24" rx="4" fill="#ff6b6b" fill-opacity="0.85"/>
  <text x="1022" y="200" fill="#0d1117" font-size="13" font-weight="bold">41</text>
  <text x="1002" y="252" fill="#c9d1d9" font-size="13">27</text>
  <text x="950" y="304" fill="#c9d1d9" font-size="13">14</text>
  <text x="936" y="356" fill="#c9d1d9" font-size="13">6</text>
  <text x="1090" y="200" fill="#8b949e" font-size="12">KES 18.4M</text>
  <text x="1090" y="252" fill="#8b949e" font-size="12">KES 9.65M</text>
  <text x="1090" y="304" fill="#8b949e" font-size="12">KES 4.10M</text>
  <text x="1090" y="356" fill="#8b949e" font-size="12">KES 2.78M</text>

  <path d="M940 380 V430" stroke="#ff6b6b" stroke-width="3" marker-end="url(#arrowRed)"/>
  <rect x="700" y="438" width="430" height="62" rx="8" fill="#1b1114" stroke="#ff6b6b" stroke-opacity="0.7"/>
  <text x="720" y="463" fill="#ff6b6b" font-size="14" font-weight="bold">SUSPENSE → UNCLAIMED (2 YEARS)</text>
  <text x="720" y="486" fill="#c9d1d9" font-size="12">aged &gt; 7 days = 23% of items, 20% of value, 60% of the write-off</text>
  <text x="700" y="530" fill="#8b949e" font-size="12">an aged break changes owner: KES 241.1bn unclaimed in Kenya, 62% financial services</text>

  <text x="1140" y="600" fill="#484f58" font-size="13" text-anchor="end">ml-ke.github.io</text>
</svg>
