<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d2ff" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#00d2ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#00d2ff" stop-opacity="0.05"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 z" fill="#ffd93d"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="70" y="82" fill="#f3f6fa" font-size="40" font-weight="bold">A Chemistry Exam You Can Audit</text>
  <text x="70" y="118" fill="#9aa7b8" font-size="20">LitmusBench v0.2, read at the row level: the split, the grader, the floor</text>

  <!-- grader-rule strips -->
  <text x="70" y="168" fill="#6bcf7f" font-size="14" letter-spacing="2">THE MARKING SCHEME TRAVELS IN THE FILE</text>

  <!-- strip 1: abs_window -->
  <g>
    <rect x="70" y="190" width="740" height="96" rx="8" fill="#111827" stroke="#243044"/>
    <text x="88" y="220" fill="#cbd5e1" font-size="17" font-weight="bold">abs_window</text>
    <text x="88" y="244" fill="#8b98a9" font-size="13">1,176 rows</text>
    <text x="88" y="264" fill="#8b98a9" font-size="13">fixed tolerance</text>
    <rect x="250" y="212" width="470" height="52" rx="4" fill="#0b1220" stroke="#1f2b3d"/>
    <rect x="300" y="222" width="360" height="32" rx="3" fill="url(#band)"/>
    <line x1="480" y1="218" x2="480" y2="258" stroke="#6bcf7f" stroke-width="3"/>
    <circle cx="602" cy="238" r="7" fill="#ffd93d"/>
    <text x="742" y="240" fill="#00d2ff" font-size="12" text-anchor="end">median band</text>
    <text x="742" y="258" fill="#00d2ff" font-size="12" text-anchor="end">0.234 x IQR</text>
  </g>

  <!-- strip 2: exact -->
  <g>
    <rect x="70" y="302" width="740" height="96" rx="8" fill="#111827" stroke="#243044"/>
    <text x="88" y="332" fill="#cbd5e1" font-size="17" font-weight="bold">exact</text>
    <text x="88" y="356" fill="#8b98a9" font-size="13">672 rows</text>
    <text x="88" y="376" fill="#8b98a9" font-size="13">rounded integer</text>
    <rect x="250" y="324" width="470" height="52" rx="4" fill="#0b1220" stroke="#1f2b3d"/>
    <line x1="480" y1="330" x2="480" y2="370" stroke="#6bcf7f" stroke-width="3"/>
    <rect x="468" y="320" width="24" height="60" rx="3" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5 4"/>
    <circle cx="474" cy="350" r="7" fill="#ffd93d"/>
    <text x="512" y="356" fill="#ff6b6b" font-size="12">one integer wide</text>
    <text x="742" y="356" fill="#8b98a9" font-size="12" text-anchor="end">10.4 and 10.0 both score 10</text>
  </g>

  <!-- strip 3: rel_window -->
  <g>
    <rect x="70" y="414" width="740" height="96" rx="8" fill="#111827" stroke="#243044"/>
    <text x="88" y="444" fill="#cbd5e1" font-size="17" font-weight="bold">rel_window</text>
    <text x="88" y="468" fill="#8b98a9" font-size="13">85 rows</text>
    <text x="88" y="488" fill="#8b98a9" font-size="13">relative tolerance</text>
    <rect x="250" y="436" width="470" height="52" rx="4" fill="#0b1220" stroke="#1f2b3d"/>
    <rect x="392" y="446" width="176" height="32" rx="3" fill="url(#band)"/>
    <line x1="480" y1="442" x2="480" y2="482" stroke="#6bcf7f" stroke-width="3"/>
    <circle cx="527" cy="462" r="7" fill="#ffd93d"/>
    <text x="742" y="462" fill="#8b98a9" font-size="12" text-anchor="end">band scales with the answer</text>
  </g>

  <text x="70" y="542" fill="#6bcf7f" font-size="13">green tick: true value</text>
  <text x="248" y="542" fill="#ffd93d" font-size="13">yellow dot: a guess the grader accepts</text>
  <text x="70" y="566" fill="#8b98a9" font-size="13">123 rows inherit the harness default, so the config is part of the benchmark</text>

  <!-- provenance seal -->
  <g transform="translate(880 178) rotate(-4)">
    <rect x="0" y="0" width="250" height="88" rx="10" fill="none" stroke="#6bcf7f" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="125" y="34" fill="#6bcf7f" font-size="15" text-anchor="middle" letter-spacing="1">SPLIT AUDIT</text>
    <text x="125" y="60" fill="#f3f6fa" font-size="21" font-weight="bold" text-anchor="middle">0 of 1,955 leaked</text>
    <text x="125" y="78" fill="#8b98a9" font-size="11" text-anchor="middle">source records, all five families</text>
  </g>

  <!-- floor panel -->
  <g>
    <rect x="880" y="296" width="250" height="196" rx="10" fill="#111827" stroke="#243044"/>
    <text x="902" y="326" fill="#ffd93d" font-size="13" letter-spacing="2">THE FLOOR</text>
    <text x="902" y="374" fill="#ffd93d" font-size="46" font-weight="bold">21.5%</text>
    <text x="902" y="396" fill="#8b98a9" font-size="12">median-per-property guess</text>

    <text x="902" y="424" fill="#cbd5e1" font-size="11">tier1 rdkit</text>
    <rect x="1000" y="415" width="98" height="10" rx="5" fill="#0b1220"/>
    <rect x="1000" y="415" width="14" height="10" rx="5" fill="#6bcf7f"/>
    <text x="1120" y="424" fill="#6bcf7f" font-size="11" text-anchor="end">8.2</text>

    <text x="902" y="448" fill="#cbd5e1" font-size="11">tier2 rdkit</text>
    <rect x="1000" y="439" width="98" height="10" rx="5" fill="#0b1220"/>
    <rect x="1000" y="439" width="30" height="10" rx="5" fill="#00d2ff"/>
    <text x="1120" y="448" fill="#00d2ff" font-size="11" text-anchor="end">17.6</text>

    <text x="902" y="472" fill="#cbd5e1" font-size="11">adme direct</text>
    <rect x="1000" y="463" width="98" height="10" rx="5" fill="#0b1220"/>
    <rect x="1000" y="463" width="52" height="10" rx="5" fill="#ff6b6b"/>
    <text x="1120" y="472" fill="#ff6b6b" font-size="11" text-anchor="end">30.1</text>
  </g>

  <text x="880" y="530" fill="#8b98a9" font-size="13">49,174 questions</text>
  <text x="880" y="552" fill="#8b98a9" font-size="13">29 answer formats</text>
  <text x="880" y="574" fill="#8b98a9" font-size="13">64 MB, no GPU to audit it</text>

  <text x="1130" y="608" fill="#4b5563" font-size="14" text-anchor="end">ml-ke.github.io</text>
</svg>
