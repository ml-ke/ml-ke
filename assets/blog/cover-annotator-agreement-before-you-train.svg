<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0.12"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#6bcf7f" stroke-width="1" opacity="0.03">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M120 0 V630 M240 0 V630 M360 0 V630 M480 0 V630 M600 0 V630 M720 0 V630 M840 0 V630 M960 0 V630 M1080 0 V630"/>
  </g>

  <text x="60" y="62" font-family="Helvetica, Arial, sans-serif" font-size="37" font-weight="bold" fill="#e6edf3">Agreement before accuracy</text>
  <text x="60" y="94" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#8892a4">240 support messages &#183; 3 annotators &#183; the ceiling your accuracy number is measured against</text>

  <!-- the annotated queue: eight items, three label chips each -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="60" y="150" width="250" height="34" rx="6" fill="#131a26" stroke="#22303f"/>
    <rect x="74" y="161" width="150" height="6" rx="3" fill="#2b3a4c"/>
    <rect x="74" y="172" width="92" height="5" rx="2.5" fill="#22303f"/>

    <rect x="60" y="198" width="250" height="34" rx="6" fill="#131a26" stroke="#22303f"/>
    <rect x="74" y="209" width="150" height="6" rx="3" fill="#2b3a4c"/>
    <rect x="74" y="220" width="92" height="5" rx="2.5" fill="#22303f"/>

    <rect x="60" y="246" width="250" height="34" rx="6" fill="#131a26" stroke="#22303f"/>
    <rect x="74" y="257" width="150" height="6" rx="3" fill="#2b3a4c"/>
    <rect x="74" y="268" width="92" height="5" rx="2.5" fill="#22303f"/>

    <rect x="60" y="294" width="250" height="34" rx="6" fill="#131a26" stroke="#22303f"/>
    <rect x="74" y="305" width="150" height="6" rx="3" fill="#2b3a4c"/>
    <rect x="74" y="316" width="92" height="5" rx="2.5" fill="#22303f"/>

    <rect x="60" y="342" width="250" height="34" rx="6" fill="#131a26" stroke="#22303f"/>
    <rect x="74" y="353" width="150" height="6" rx="3" fill="#2b3a4c"/>
    <rect x="74" y="364" width="92" height="5" rx="2.5" fill="#22303f"/>

    <rect x="60" y="390" width="250" height="34" rx="6" fill="#131a26" stroke="#22303f"/>
    <rect x="74" y="401" width="150" height="6" rx="3" fill="#2b3a4c"/>
    <rect x="74" y="412" width="92" height="5" rx="2.5" fill="#22303f"/>

    <rect x="60" y="438" width="250" height="34" rx="6" fill="#131a26" stroke="#22303f"/>
    <rect x="74" y="449" width="150" height="6" rx="3" fill="#2b3a4c"/>
    <rect x="74" y="460" width="92" height="5" rx="2.5" fill="#22303f"/>

    <rect x="60" y="486" width="250" height="34" rx="6" fill="#131a26" stroke="#22303f"/>
    <rect x="74" y="497" width="150" height="6" rx="3" fill="#2b3a4c"/>
    <rect x="74" y="508" width="92" height="5" rx="2.5" fill="#22303f"/>
  </g>

  <!-- annotator A (purple), B (cyan), C (green): aligned when they agree -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    <g fill="#131a26" stroke="#a78bfa" stroke-width="1.6">
      <rect x="330" y="150" width="32" height="34" rx="6"/>
      <rect x="330" y="198" width="32" height="34" rx="6"/>
      <rect x="330" y="246" width="32" height="34" rx="6"/>
      <rect x="330" y="294" width="32" height="34" rx="6"/>
      <rect x="330" y="342" width="32" height="34" rx="6"/>
      <rect x="330" y="390" width="32" height="34" rx="6"/>
      <rect x="330" y="438" width="32" height="34" rx="6"/>
      <rect x="330" y="486" width="32" height="34" rx="6"/>
    </g>
    <g fill="#a78bfa">
      <text x="346" y="173">A</text><text x="346" y="221">A</text><text x="346" y="269">A</text>
      <text x="346" y="317">A</text><text x="346" y="365">A</text><text x="346" y="413">A</text>
      <text x="346" y="461">A</text><text x="346" y="509">A</text>
    </g>
    <g fill="#131a26" stroke="#00d2ff" stroke-width="1.6">
      <rect x="374" y="150" width="32" height="34" rx="6"/>
      <rect x="374" y="198" width="32" height="34" rx="6"/>
      <rect x="374" y="246" width="32" height="34" rx="6"/>
      <rect x="374" y="294" width="32" height="34" rx="6"/>
      <rect x="374" y="342" width="32" height="34" rx="6"/>
      <rect x="374" y="390" width="32" height="34" rx="6"/>
      <rect x="374" y="438" width="32" height="34" rx="6"/>
    </g>
    <g fill="#00d2ff">
      <text x="390" y="173">B</text><text x="390" y="221">B</text><text x="390" y="269">B</text>
      <text x="390" y="317">B</text><text x="390" y="365">B</text><text x="390" y="413">B</text>
      <text x="390" y="461">B</text>
    </g>
    <g fill="#131a26" stroke="#6bcf7f" stroke-width="1.6">
      <rect x="418" y="150" width="32" height="34" rx="6"/>
      <rect x="418" y="198" width="32" height="34" rx="6"/>
      <rect x="418" y="294" width="32" height="34" rx="6"/>
      <rect x="418" y="342" width="32" height="34" rx="6"/>
      <rect x="418" y="438" width="32" height="34" rx="6"/>
      <rect x="418" y="486" width="32" height="34" rx="6"/>
    </g>
    <g fill="#6bcf7f">
      <text x="434" y="173">C</text><text x="434" y="221">C</text><text x="434" y="317">C</text>
      <text x="434" y="365">C</text><text x="434" y="461">C</text><text x="434" y="509">C</text>
    </g>
  </g>

  <!-- two rows where one annotator's label drifts off the column -->
  <rect x="470" y="246" width="32" height="34" rx="6" fill="#1d1114" stroke="#ff6b6b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="486" y="269" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff6b6b">C</text>
  <rect x="470" y="390" width="32" height="34" rx="6" fill="#1d1114" stroke="#ff6b6b" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="486" y="413" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff6b6b">B</text>
  <path d="M450 263 H468" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M406 407 H468" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M512 152 V518" stroke="url(#rail)" stroke-width="1.4" stroke-dasharray="7 6"/>
  <text x="512" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#ff6b6b">drifting label</text>

  <!-- readout -->
  <rect x="560" y="150" width="580" height="196" rx="12" fill="#131a26" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="582" y="180" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#e6edf3">measured on the fixture, not assumed</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14.5" fill="#cfe3f2">
    <text x="582" y="210">A-B   agreement 0.7915   kappa 0.6790</text>
    <text x="582" y="234">A-C   agreement 0.7642   kappa 0.6289</text>
    <text x="582" y="258">B-C   agreement 0.7429   kappa 0.5889</text>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8892a4">
    <text x="582" y="288">alpha 0.631529 over 240 units, 6.5% of cells unlabelled</text>
    <text x="582" y="310">ordinal alpha 0.751008 on the same labels read as a scale</text>
    <text x="582" y="332">chance agreement 0.3504: the marginals are doing the work</text>
  </g>

  <rect x="560" y="366" width="580" height="154" rx="12" fill="#2a2310" stroke="#ffd93d" stroke-width="1.5"/>
  <text x="582" y="396" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ffd93d">the ceiling, and the prevalence trap</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#f0e6c8">
    <text x="582" y="424">a model that copies A exactly scores 0.7915 against B</text>
    <text x="582" y="448">same 0.900 agreement: kappa 0.800 balanced, 0.137 at 1%</text>
    <text x="582" y="472">a 100-item audit leaves a kappa interval 0.22 wide</text>
    <text x="582" y="496">report the interval, not the point estimate</text>
  </g>

  <text x="60" y="586" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6bcf7f">Agreement is the number your accuracy claim rests on, and it costs one evening to measure.</text>
  <text x="1140" y="612" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563">ml-ke.github.io</text>
</svg>
