<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="cont" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="toks" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#6bcf7f" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.03">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path d="M120 0V630M240 0V630M360 0V630M480 0V630M600 0V630M720 0V630M840 0V630M960 0V630M1080 0V630"/>
  </g>

  <text x="60" y="86" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#e6edf3">The Tokenizer Was the Point</text>
  <text x="60" y="124" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#8b949e">MORENA: a 1.5B model trained from scratch for 12 African languages</text>

  <rect x="954" y="46" width="186" height="40" rx="20" fill="#6bcf7f" fill-opacity="0.12" stroke="#6bcf7f" stroke-opacity="0.7"/>
  <text x="1047" y="72" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#6bcf7f" text-anchor="middle">Apache 2.0 weights</text>

  <!-- continuous text, then the same text as tokens -->
  <rect x="70" y="228" width="248" height="78" rx="12" fill="url(#cont)" stroke="#00d2ff" stroke-opacity="0.8" stroke-width="2"/>
  <text x="92" y="262" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8fe6ff">Swahili text</text>
  <text x="92" y="290" font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="bold" fill="#e6edf3">96 bytes</text>

  <path d="M326 267H392" stroke="#8b949e" stroke-opacity="0.8" stroke-width="3"/>
  <path d="M384 259L396 267L384 275Z" fill="#8b949e" fill-opacity="0.8"/>

  <rect x="396" y="196" width="188" height="142" rx="14" fill="#ffd93d" fill-opacity="0.08" stroke="#ffd93d" stroke-opacity="0.8" stroke-width="2"/>
  <text x="490" y="228" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#ffd93d" text-anchor="middle">tokenizer vocab</text>
  <text x="490" y="274" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#e6edf3" text-anchor="middle">65,536</text>
  <text x="490" y="304" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e" text-anchor="middle">trained on the mix</text>

  <path d="M592 267H658" stroke="#8b949e" stroke-opacity="0.8" stroke-width="3"/>
  <path d="M650 259L662 267L650 275Z" fill="#8b949e" fill-opacity="0.8"/>

  <rect x="662" y="228" width="58" height="78" rx="8" fill="url(#toks)" stroke="#a78bfa" stroke-opacity="0.8" stroke-width="2"/>
  <rect x="726" y="228" width="44" height="78" rx="8" fill="url(#toks)" stroke="#a78bfa" stroke-opacity="0.8" stroke-width="2"/>
  <rect x="776" y="228" width="72" height="78" rx="8" fill="url(#toks)" stroke="#a78bfa" stroke-opacity="0.8" stroke-width="2"/>
  <rect x="854" y="228" width="50" height="78" rx="8" fill="url(#toks)" stroke="#a78bfa" stroke-opacity="0.8" stroke-width="2"/>
  <rect x="910" y="228" width="62" height="78" rx="8" fill="url(#toks)" stroke="#6bcf7f" stroke-opacity="0.8" stroke-width="2"/>
  <text x="662" y="352" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#c9b6ff">23 tokens  ·  0.240 tokens per byte</text>
  <text x="1120" y="378" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#9fe8ad" text-anchor="end">no per-character surcharge</text>

  <!-- cost bars: tokens per byte, relative to English -->
  <text x="70" y="418" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#e6edf3">Cost per character vs English</text>
  <text x="70" y="444" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">measured on the released tokenizer</text>

  <text x="72" y="492" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#9fe8ad">MORENA</text>
  <rect x="200" y="474" width="99" height="26" rx="6" fill="#6bcf7f" fill-opacity="0.85"/>
  <text x="312" y="494" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#9fe8ad">0.99x</text>

  <text x="72" y="534" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#ff9d9d">GPT-4o</text>
  <rect x="200" y="516" width="156" height="26" rx="6" fill="#ff6b6b" fill-opacity="0.85"/>
  <text x="369" y="536" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#ff9d9d">1.56x</text>

  <text x="72" y="576" font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#ff9d9d">GPT-4</text>
  <rect x="200" y="558" width="206" height="26" rx="6" fill="#ff6b6b" fill-opacity="0.55"/>
  <text x="419" y="578" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#ff9d9d">2.06x</text>

  <!-- the twelve languages -->
  <text x="560" y="418" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#e6edf3">Twelve languages, English and French</text>
  <g fill="#00d2ff" fill-opacity="0.10" stroke="#00d2ff" stroke-opacity="0.55">
    <rect x="560" y="440" width="86" height="32" rx="16"/>
    <rect x="656" y="440" width="86" height="32" rx="16"/>
    <rect x="752" y="440" width="86" height="32" rx="16"/>
    <rect x="848" y="440" width="86" height="32" rx="16"/>
    <rect x="944" y="440" width="86" height="32" rx="16"/>
    <rect x="1040" y="440" width="86" height="32" rx="16"/>
    <rect x="560" y="482" width="86" height="32" rx="16"/>
    <rect x="656" y="482" width="86" height="32" rx="16"/>
    <rect x="752" y="482" width="86" height="32" rx="16"/>
    <rect x="848" y="482" width="86" height="32" rx="16"/>
    <rect x="944" y="482" width="86" height="32" rx="16"/>
    <rect x="1040" y="482" width="86" height="32" rx="16"/>
  </g>
  <g font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#8fe6ff" text-anchor="middle">
    <text x="603" y="461">SW</text>
    <text x="699" y="461">HA</text>
    <text x="795" y="461">YO</text>
    <text x="891" y="461">IG</text>
    <text x="987" y="461">ZU</text>
    <text x="1083" y="461">XH</text>
    <text x="603" y="503">RW</text>
    <text x="699" y="503">TN</text>
    <text x="795" y="503">AF</text>
    <text x="891" y="503">NR</text>
    <text x="987" y="503">PCM</text>
    <text x="1083" y="503">SN</text>
  </g>
  <text x="560" y="546" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">ChiShona, Kiswahili, Hausa, Yoruba, Igbo, isiZulu,</text>
  <text x="560" y="568" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">isiXhosa, Kinyarwanda, Setswana, Afrikaans, isiNdebele,</text>
  <text x="560" y="590" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">Nigerian Pidgin ... plus English and French</text>

  <text x="1140" y="612" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#484f58" text-anchor="end">ml-ke.github.io</text>
</svg>
