  <text x="60" y="86" class="title">Clicks Are Not Judgments</text>
  <text x="60" y="122" class="sub">A click is an event shaped by the slot. Divide it by that slot's own weight.</text>
  <text x="60" y="148" class="sub">Same log, two estimates: raw rate versus inverse propensity.</text>

  <text x="62" y="176" class="head">SLOT</text>
  <text x="100" y="176" class="head">HOW OFTEN IT WAS SEEN</text>
  <text x="452" y="176" class="head">1 / p</text>
  <text x="560" y="176" class="head">AFTER WEIGHTING</text>

