  <text x="850" y="212" class="note">raw clicks per thousand</text>
  <text x="850" y="240" class="note">impressions fall 5.6x from</text>
  <text x="850" y="268" class="note">slot one to slot ten.</text>
  <text x="850" y="308" class="note">The corrected estimate does</text>
  <text x="850" y="336" class="note">not, because the fall was</text>
  <text x="850" y="364" class="note">the layout, not the document.</text>

  <rect x="850" y="400" width="286" height="96" rx="8" fill="#161b22" stroke="#30363d"/>
