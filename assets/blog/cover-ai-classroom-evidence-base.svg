<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b27"/>
      <stop offset="1" stop-color="#12161f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-width="1" opacity="0.03">
    <line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1140" y1="0" x2="1140" y2="630"/>
  </g>

  <text x="58" y="88" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="bold" fill="#f0f4f8">The evidence doubled,</text>
  <text x="58" y="136" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="bold" fill="#f0f4f8">the effect did not</text>
  <text x="58" y="174" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#9aa7b8">52 causal studies on AI in classrooms, and the numbers that survive them</text>

