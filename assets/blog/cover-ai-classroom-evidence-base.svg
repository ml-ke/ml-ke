  <circle cx="475.3" cy="534.6" r="5.6" fill="#00d2ff" opacity="0.55"/>

  <!-- the negative estimate -->
  <circle cx="206" cy="500" r="12" fill="#ff6b6b"/>
  <circle cx="206" cy="500" r="19" fill="none" stroke="#ff6b6b" stroke-width="1.5" opacity="0.45"/>
  <line x1="206" y1="522" x2="206" y2="548" stroke="#ff6b6b" stroke-width="1.5" opacity="0.6"/>
  <text x="150" y="578" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#ff6b6b">-0.37 SD</text>

  <!-- axes -->
  <line x1="110" y1="558" x2="610" y2="558" stroke="#8b98a8" stroke-width="1.5"/>
  <text x="66" y="592" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#8b98a8">-0.60</text>
  <text x="244" y="592" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#8b98a8">-0.30</text>
  <text x="348" y="592" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#8b98a8">0.00</text>
  <text x="444" y="592" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#8b98a8">+0.30</text>
  <text x="532" y="592" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#8b98a8">+0.60</text>
  <text x="228" y="614" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#8b98a8">effect size, standard deviations</text>

  <text x="86" y="300" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#8b98a8" transform="rotate(-90 86 300)">precision of the study</text>

  <!-- right hand panels -->
  <rect x="648" y="238" width="486" height="96" rx="10" fill="url(#panel)" stroke="#252c3a"/>
  <text x="676" y="278" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="bold" fill="#00d2ff">20 to 52</text>
  <text x="676" y="308" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#9aa7b8">causal papers, March to November 2026</text>

  <rect x="648" y="350" width="486" height="96" rx="10" fill="url(#panel)" stroke="#252c3a"/>
  <text x="676" y="390" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="bold" fill="#ffd93d">0.42 SD</text>
  <text x="676" y="420" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#9aa7b8">smallest effect a 20-school pilot can see</text>

  <rect x="648" y="462" width="486" height="96" rx="10" fill="url(#panel)" stroke="#252c3a"/>
  <text x="676" y="502" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="bold" fill="#a78bfa">356 schools</text>
  <text x="676" y="532" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#9aa7b8">per arm, to detect a 0.10 SD gain</text>

  <text x="648" y="596" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#5f6b7c">ml-ke.github.io</text>
