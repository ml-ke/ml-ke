  <circle cx="405.6" cy="328.5" r="8.1" fill="#00d2ff" opacity="0.55"/>
  <circle cx="443.8" cy="339.3" r="8.0" fill="#00d2ff" opacity="0.55"/>
  <circle cx="320.5" cy="350.2" r="7.9" fill="#00d2ff" opacity="0.55"/>
  <circle cx="444.3" cy="361.0" r="7.7" fill="#00d2ff" opacity="0.55"/>
  <circle cx="281.7" cy="371.9" r="7.6" fill="#00d2ff" opacity="0.55"/>
  <circle cx="402.1" cy="382.7" r="7.5" fill="#00d2ff" opacity="0.55"/>
  <circle cx="409.4" cy="393.6" r="7.3" fill="#00d2ff" opacity="0.55"/>
  <circle cx="354.7" cy="404.4" r="7.2" fill="#00d2ff" opacity="0.55"/>
  <circle cx="362.7" cy="415.3" r="7.0" fill="#00d2ff" opacity="0.55"/>
  <circle cx="389.9" cy="426.1" r="6.9" fill="#00d2ff" opacity="0.55"/>
  <circle cx="287.0" cy="437.0" r="6.8" fill="#00d2ff" opacity="0.55"/>
  <circle cx="377.1" cy="447.8" r="6.6" fill="#00d2ff" opacity="0.55"/>
  <circle cx="347.7" cy="458.7" r="6.5" fill="#00d2ff" opacity="0.55"/>
  <circle cx="412.6" cy="469.5" r="6.4" fill="#00d2ff" opacity="0.55"/>
