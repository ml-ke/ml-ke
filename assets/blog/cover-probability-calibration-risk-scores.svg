<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="plotbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g stroke="#8b949e" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/><line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="150" y1="0" x2="150" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="450" y1="0" x2="450" y2="630"/><line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/><line x1="1050" y1="0" x2="1050" y2="630"/>
  </g>

  <text x="70" y="76" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#f0f6fc">Your Model's 0.9 Is Not a 90% Chance</text>
  <text x="70" y="114" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8b949e">Calibrate the risk score before you set the threshold</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="14">
    <line x1="70" y1="148" x2="106" y2="148" stroke="#ff6b6b" stroke-width="3"/>
    <text x="114" y="153" fill="#c9d1d9">raw score</text>
    <line x1="228" y1="148" x2="264" y2="148" stroke="#6bcf7f" stroke-width="3"/>
    <text x="272" y="153" fill="#c9d1d9">after calibration</text>
    <line x1="424" y1="148" x2="460" y2="148" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="468" y="153" fill="#c9d1d9">perfect calibration</text>
  </g>

  <rect x="60" y="172" width="712" height="392" rx="8" fill="url(#plotbg)" stroke="#30363d" stroke-width="1"/>

  <g stroke="#484f58" stroke-width="1" stroke-opacity="0.5">
    <line x1="70" y1="432" x2="760" y2="432"/>
    <line x1="70" y1="324" x2="760" y2="324"/>
    <line x1="70" y1="216" x2="760" y2="216"/>
    <line x1="760" y1="180" x2="760" y2="540"/>
  </g>

  <line x1="70" y1="540" x2="760" y2="540" stroke="#8b949e" stroke-width="2"/>
  <line x1="70" y1="180" x2="70" y2="540" stroke="#8b949e" stroke-width="2"/>

  <line x1="70" y1="540" x2="760" y2="180" stroke="#8b949e" stroke-width="2" stroke-dasharray="7 6"/>

  <polyline points="93,528 139,497 184,485 232,460 277,460 322,429 370,418 415,419 460,396 508,391 553,371 598,333 646,344 691,310 736,260"
    fill="none" stroke="#ff6b6b" stroke-width="3.5" stroke-linejoin="round"/>

  <polyline points="93,538 139,522 184,504 232,487 277,470 322,453 370,436 415,419 460,402 508,385 553,368 598,351 646,334 691,317 736,300"
    fill="none" stroke="#6bcf7f" stroke-width="3" stroke-linejoin="round" stroke-opacity="0.95"/>

  <line x1="691" y1="180" x2="691" y2="540" stroke="#00d2ff" stroke-width="2" stroke-dasharray="5 5" stroke-opacity="0.85"/>
  <text x="697" y="196" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#00d2ff">alert cut 0.90</text>

  <circle cx="736" cy="260" r="5" fill="#ff6b6b"/>
  <circle cx="736" cy="300" r="5" fill="#6bcf7f"/>

  <text x="70" y="592" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">predicted risk</text>
  <text x="34" y="360" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e" transform="rotate(-90 34 360)">observed rate</text>

  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="796" y="186" width="336" height="86" rx="10" fill="#00d2ff" fill-opacity="0.10" stroke="#00d2ff" stroke-opacity="0.45"/>
    <text x="818" y="228" font-size="30" font-weight="bold" fill="#00d2ff">ECE 3.12%</text>
    <text x="818" y="252" font-size="14" fill="#c9d1d9">expected calibration error</text>

    <rect x="796" y="288" width="336" height="86" rx="10" fill="#ffd93d" fill-opacity="0.10" stroke="#ffd93d" stroke-opacity="0.45"/>
    <text x="818" y="330" font-size="30" font-weight="bold" fill="#ffd93d">MCE 28.87%</text>
    <text x="818" y="354" font-size="14" fill="#c9d1d9">worst single bin</text>

    <rect x="796" y="390" width="336" height="86" rx="10" fill="#ff6b6b" fill-opacity="0.10" stroke="#ff6b6b" stroke-opacity="0.45"/>
    <text x="818" y="432" font-size="30" font-weight="bold" fill="#ff6b6b">slope 0.61</text>
    <text x="818" y="456" font-size="14" fill="#c9d1d9">risks too extreme</text>

    <rect x="796" y="492" width="336" height="86" rx="10" fill="#6bcf7f" fill-opacity="0.10" stroke="#6bcf7f" stroke-opacity="0.45"/>
    <text x="818" y="534" font-size="30" font-weight="bold" fill="#6bcf7f">AUC 0.818</text>
    <text x="818" y="558" font-size="14" fill="#c9d1d9">unchanged before and after</text>
  </g>

  <text x="1150" y="614" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#484f58">ml-ke.github.io</text>
</svg>
