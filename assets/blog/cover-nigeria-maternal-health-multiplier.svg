    <text x="726" y="320" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#93a0ad">guidance and a two-way helpdesk on a phone</text>
    <text x="1140" y="342" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7c8c" text-anchor="end">DELAY 1</text>
  </g>

  <g>
    <rect x="700" y="372" width="460" height="100" rx="12" fill="#131c26" stroke="#24313d" stroke-width="1.5"/>
