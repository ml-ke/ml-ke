  <rect width="1200" height="630" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M60 0V630 M120 0V630 M180 0V630 M240 0V630 M300 0V630 M360 0V630 M420 0V630 M480 0V630 M540 0V630 M600 0V630 M660 0V630 M720 0V630 M780 0V630 M840 0V630 M900 0V630 M960 0V630 M1020 0V630 M1080 0V630 M1140 0V630"/>
    <path d="M0 60H1200 M0 120H1200 M0 180H1200 M0 240H1200 M0 300H1200 M0 360H1200 M0 420H1200 M0 480H1200 M0 540H1200 M0 600H1200"/>
  </g>

  <text x="60" y="80" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#f0f3f7">The Bottleneck Is Adoption,</text>
  <text x="60" y="130" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="bold" fill="#00d2ff">Not Innovation</text>
  <text x="60" y="172" font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#94a1ae">Nigeria's Maternal Health Multiplier: three targets, one of them a model</text>

