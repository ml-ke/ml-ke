      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="screenglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1a24"/>
      <stop offset="100%" stop-color="#0b2230"/>
