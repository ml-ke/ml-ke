  <text x="60" y="620" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#7f8c99">Nigeria: about 30% of global maternal deaths  ·  59% complete 4+ ANC visits (WHO: 8)</text>
  <text x="1140" y="620" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#64707c" text-anchor="end">ml-ke.github.io</text>
