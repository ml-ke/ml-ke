  </g>
  <text x="240" y="466" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#7f8c99" text-anchor="middle">helpdesk</text>

  <circle cx="312" cy="410" r="4" fill="#00d2ff"/>
  <g fill="none" stroke="#00d2ff" stroke-width="2" stroke-opacity="0.55">
    <path d="M312 410C470 410 540 300 700 300"/>
    <path d="M312 410C470 410 540 422 700 422"/>
    <path d="M312 410C470 410 540 544 700 544"/>
  </g>

  <g>
    <rect x="700" y="250" width="460" height="100" rx="12" fill="#131c26" stroke="#24313d" stroke-width="1.5"/>
