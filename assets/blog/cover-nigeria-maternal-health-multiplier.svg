    <text x="726" y="410" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#eef2f6">FRONTLINE HEALTH WORKERS</text>
    <text x="1140" y="412" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#00d2ff" text-anchor="end">5,000</text>
    <text x="726" y="442" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#93a0ad">phone-based decision support on danger signs</text>
    <text x="1140" y="464" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7c8c" text-anchor="end">DELAYS 1 + 3</text>
  </g>

  <g>
    <rect x="700" y="494" width="460" height="100" rx="12" fill="#131c26" stroke="#24313d" stroke-width="1.5"/>
    <rect x="700" y="494" width="6" height="100" rx="3" fill="#a78bfa"/>
    <text x="726" y="532" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="bold" fill="#eef2f6">PRIMARY HEALTH FACILITIES</text>
    <text x="1140" y="534" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#a78bfa" text-anchor="end">500</text>
    <text x="726" y="564" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#93a0ad">connectivity plus a coordination protocol</text>
    <text x="1140" y="586" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b7c8c" text-anchor="end">DELAYS 2 + 3</text>
