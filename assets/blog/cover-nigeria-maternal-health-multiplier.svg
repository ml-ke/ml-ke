  <rect x="224" y="312" width="32" height="5" rx="2" fill="#2c3e50"/>
  <rect x="182" y="326" width="116" height="168" rx="8" fill="url(#screenglow)" stroke="#00d2ff" stroke-opacity="0.45" stroke-width="1.5"/>
  <text x="240" y="358" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#7fb3c8" text-anchor="middle">2-WAY</text>
  <g stroke-linecap="round">
