<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="cabinet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#21262d"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2d333b"/>
      <stop offset="100%" stop-color="#22272e"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Filing cabinet (left) -->
  <g>
    <rect x="120" y="140" width="340" height="420" rx="12" fill="url(#cabinet)" stroke="#30363d" stroke-width="2"/>
    <!-- Drawers -->
    <rect x="140" y="170" width="300" height="80" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
    <rect x="140" y="270" width="300" height="80" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
    <rect x="140" y="370" width="300" height="80" rx="6" fill="#1c2128" stroke="#30363d" stroke-width="1.5"/>
    <!-- Drawer handles -->
    <rect x="265" y="196" width="50" height="8" rx="4" fill="#484f58"/>
    <rect x="265" y="296" width="50" height="8" rx="4" fill="#484f58"/>
    <rect x="265" y="396" width="50" height="8" rx="4" fill="#484f58"/>
    <!-- Skill labels on drawers -->
    <text x="160" y="212" font-family="monospace" font-size="14" fill="#6bcf7f">tob-semgrep</text>
    <text x="160" y="312" font-family="monospace" font-size="14" fill="#00d2ff">anthropic-claude-api</text>
    <text x="160" y="412" font-family="monospace" font-size="14" fill="#a78bfa">flutter-testing</text>
    <!-- Open drawer (top) with cards fanned out -->
    <rect x="140" y="170" width="300" height="80" rx="6" fill="#161b22" stroke="#ffd93d" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <!-- Skill cards flying out of the open drawer -->
  <g>
    <!-- Card 1 (largest, closest) -->
    <g transform="rotate(-8 480 220)">
      <rect x="450" y="150" width="190" height="120" rx="8" fill="url(#card)" stroke="#ffd93d" stroke-width="2"/>
      <rect x="466" y="166" width="120" height="10" rx="3" fill="#6bcf7f"/>
      <rect x="466" y="186" width="150" height="10" rx="3" fill="#30363d"/>
      <rect x="466" y="206" width="140" height="10" rx="3" fill="#30363d"/>
      <text x="466" y="246" font-family="monospace" font-size="13" fill="#ffd93d">SKILL.md</text>
    </g>
    <!-- Card 2 -->
    <g transform="rotate(6 540 260)">
      <rect x="510" y="230" width="160" height="100" rx="8" fill="url(#card)" stroke="#00d2ff" stroke-width="2"/>
      <rect x="524" y="244" width="100" height="9" rx="3" fill="#6bcf7f"/>
      <rect x="524" y="262" width="130" height="9" rx="3" fill="#30363d"/>
      <text x="524" y="300" font-family="monospace" font-size="12" fill="#00d2ff">references/</text>
    </g>
    <!-- Card 3 -->
    <g transform="rotate(-4 600 300)">
      <rect x="570" y="280" width="140" height="90" rx="8" fill="url(#card)" stroke="#a78bfa" stroke-width="2"/>
      <rect x="584" y="294" width="90" height="9" rx="3" fill="#6bcf7f"/>
      <text x="584" y="340" font-family="monospace" font-size="12" fill="#a78bfa">scripts/</text>
    </g>
  </g>

  <!-- Robot arm (right side) reaching for a card -->
  <g stroke="url(#arm)" stroke-width="14" stroke-linecap="round" fill="none">
    <!-- Shoulder to elbow -->
    <path d="M 950 520 L 880 430 L 790 400"/>
    <!-- Elbow to wrist -->
    <path d="M 790 400 L 720 360"/>
  </g>
  <!-- Joints -->
  <circle cx="950" cy="520" r="16" fill="#1a1a2e" stroke="#00d2ff" stroke-width="5"/>
  <circle cx="790" cy="400" r="12" fill="#1a1a2e" stroke="#a78bfa" stroke-width="4"/>
  <!-- Gripper -->
  <g transform="translate(720 360)">
    <rect x="-6" y="-18" width="12" height="22" rx="4" fill="#00d2ff"/>
    <rect x="-6" y="4" width="12" height="16" rx="4" fill="#00d2ff"/>
    <rect x="-34" y="-6" width="26" height="8" rx="3" fill="#a78bfa"/>
  </g>
  <!-- Card being grabbed -->
  <g transform="rotate(-12 655 300)">
    <rect x="620" y="270" width="120" height="80" rx="6" fill="#ffd93d" opacity="0.95"/>
    <rect x="632" y="282" width="80" height="8" rx="3" fill="#0d1117" opacity="0.7"/>
    <rect x="632" y="298" width="96" height="8" rx="3" fill="#0d1117" opacity="0.4"/>
    <text x="632" y="330" font-family="monospace" font-size="12" fill="#0d1117">name + desc</text>
  </g>

  <!-- Terminal cursor element (bottom right) -->
  <g>
    <rect x="880" y="470" width="260" height="46" rx="8" fill="#161b22" stroke="#00d2ff" stroke-width="1.5"/>
    <text x="896" y="500" font-family="monospace" font-size="18" fill="#00d2ff">skill({ name: "..." })</text>
    <rect x="1116" y="481" width="12" height="22" fill="#6bcf7f" opacity="0.9"/>
  </g>

  <!-- Title -->
  <text x="60" y="80" font-family="sans-serif" font-size="34" font-weight="bold" fill="#e6edf3">Agent Skills, Loaded On Demand</text>
  <text x="60" y="112" font-family="sans-serif" font-size="20" fill="#8b949e">How a coding agent picks the right knowledge — without carrying it all</text>

  <!-- Logo -->
  <text x="1010" y="600" font-family="sans-serif" font-size="18" fill="#484f58">ml-ke.github.io</text>
</svg>
