<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2333"/>
      <stop offset="1" stop-color="#141a26"/>
    </linearGradient>
    <marker id="arrowC" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#00d2ff"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M100 0 V630 M200 0 V630 M300 0 V630 M400 0 V630 M500 0 V630 M600 0 V630 M700 0 V630 M800 0 V630 M900 0 V630 M1000 0 V630 M1100 0 V630"/>
  </g>

  <!-- title -->
  <text x="70" y="86" font-family="sans-serif" font-size="52" font-weight="bold" fill="#f0f6fc">FOLLOW THE LEAK</text>
  <text x="72" y="122" font-family="sans-serif" font-size="24" fill="#8b949e">Four channels a prompt-injected agent exfiltrates data through</text>

  <!-- poisoned document (input) -->
  <g transform="translate(95,205) rotate(-3)">
    <rect width="205" height="150" rx="10" fill="#dbe2ea"/>
    <rect x="10" y="10" width="185" height="130" rx="6" fill="#f6f8fa"/>
    <line x1="25" y1="40" x2="175" y2="40" stroke="#9aa4b2" stroke-width="6" stroke-linecap="round"/>
    <line x1="25" y1="62" x2="150" y2="62" stroke="#9aa4b2" stroke-width="6" stroke-linecap="round"/>
    <line x1="25" y1="84" x2="175" y2="84" stroke="#ff6b6b" stroke-width="6" stroke-linecap="round" stroke-dasharray="4 5"/>
    <line x1="25" y1="106" x2="130" y2="106" stroke="#9aa4b2" stroke-width="6" stroke-linecap="round"/>
    <rect x="20" y="70" width="162" height="28" rx="4" fill="none" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="6 5"/>
  </g>
  <text x="100" y="385" font-family="sans-serif" font-size="17" fill="#ff6b6b">invisible payload rides inside</text>

  <!-- retrieval arrow -->
  <line x1="305" y1="285" x2="415" y2="285" stroke="#00d2ff" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#arrowC)"/>
  <text x="318" y="272" font-family="sans-serif" font-size="15" fill="#8b949e">reads + obeys</text>

  <!-- LLM assistant chip -->
  <g transform="translate(425,205)">
    <rect width="180" height="160" rx="18" fill="url(#chip)" stroke="#00d2ff" stroke-width="3"/>
    <circle cx="90" cy="58" r="26" fill="none" stroke="#00d2ff" stroke-width="3"/>
    <path d="M84 52 L96 52 L90 68 Z" fill="#00d2ff"/>
    <text x="90" y="122" text-anchor="middle" font-family="sans-serif" font-size="26" font-weight="bold" fill="#e6edf3">LLM</text>
    <text x="90" y="146" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#8b949e">assistant</text>
  </g>

  <!-- pipes to attacker -->
  <!-- LINK pipe -->
  <path d="M605 250 C 720 250, 760 200, 870 200 L 970 200" fill="none" stroke="#ff6b6b" stroke-width="5"/>
  <g fill="#ff6b6b"><rect x="700" y="243" width="10" height="10" rx="2"/><rect x="760" y="243" width="10" height="10" rx="2"/><rect x="820" y="243" width="10" height="10" rx="2"/></g>
  <text x="612" y="240" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ff6b6b">LINK</text>

  <!-- FETCH pipe -->
  <path d="M605 300 C 720 300, 760 300, 870 300 L 970 300" fill="none" stroke="#00d2ff" stroke-width="5"/>
  <g fill="#00d2ff"><rect x="700" y="293" width="10" height="10" rx="2"/><rect x="760" y="293" width="10" height="10" rx="2"/><rect x="820" y="293" width="10" height="10" rx="2"/></g>
  <text x="612" y="290" font-family="sans-serif" font-size="16" font-weight="bold" fill="#00d2ff">FETCH</text>

  <!-- DIAGRAM pipe -->
  <path d="M605 350 C 720 350, 760 400, 870 400 L 970 400" fill="none" stroke="#ffd93d" stroke-width="5"/>
  <g fill="#ffd93d"><rect x="700" y="343" width="10" height="10" rx="2"/><rect x="760" y="343" width="10" height="10" rx="2"/><rect x="820" y="343" width="10" height="10" rx="2"/></g>
  <text x="612" y="340" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffd93d">DIAGRAM</text>

  <!-- MEMORY self-loop -->
  <path d="M515 375 C 480 470, 620 470, 575 372" fill="none" stroke="#a78bfa" stroke-width="5" stroke-dasharray="9 6"/>
  <path d="M571 362 L 583 366 L 575 380 Z" fill="#a78bfa"/>
  <text x="478" y="470" font-family="sans-serif" font-size="16" font-weight="bold" fill="#a78bfa">MEMORY persists</text>

  <!-- attacker receiver dish -->
  <g transform="translate(985,150)">
    <path d="M0 0 A 90 90 0 0 1 180 0" fill="none" stroke="#ff6b6b" stroke-width="6"/>
    <line x1="90" y1="0" x2="90" y2="70" stroke="#ff6b6b" stroke-width="6"/>
    <circle cx="90" cy="85" r="16" fill="#ff6b6b"/>
    <path d="M14 14 L 90 85" stroke="#ff6b6b" stroke-width="2"/>
    <path d="M166 14 L 90 85" stroke="#ff6b6b" stroke-width="2"/>
    <circle cx="90" cy="4" r="7" fill="#2d333b" stroke="#ff6b6b" stroke-width="2"/>
  </g>
  <text x="1075" y="395" text-anchor="end" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ff6b6b">attacker endpoint</text>
  <text x="1075" y="418" text-anchor="end" font-family="sans-serif" font-size="15" fill="#8b949e">beacon URL / webhook</text>

  <!-- caption -->
  <text x="70" y="560" font-family="sans-serif" font-size="20" fill="#6bcf7f">Hidden text in, bytes out — gate the pipes, not just the prompt.</text>

  <!-- logo -->
  <text x="1130" y="600" text-anchor="end" font-family="sans-serif" font-size="17" fill="#57606a">ml-ke.github.io</text>
</svg>
