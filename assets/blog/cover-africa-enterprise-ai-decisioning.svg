<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A decision engine drawn inside a bank's own perimeter wall, with a policy change replayed against history before promotion">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
    <marker id="aCyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#00d2ff"/>
    </marker>
    <marker id="aGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#6bcf7f"/>
    </marker>
    <marker id="aRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#ff6b6b"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <text x="600" y="66" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#f0f6fc">Sold to the Bank, Runs in the Bank</text>
  <text x="600" y="100" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" fill="#8b949e">Decisioning AI that a regulated lender installs, operates and can replay</text>

  <text x="70" y="166" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e" letter-spacing="1">APPLICATIONS</text>
  <rect x="70" y="184" width="160" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="82" y="206" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">APP-00001</text>
  <text x="82" y="224" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">score 641 &#183; DTI 0.28</text>
  <rect x="70" y="246" width="160" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="82" y="268" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">APP-00002</text>
  <text x="82" y="286" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">score 584 &#183; DTI 0.51</text>
  <rect x="70" y="308" width="160" height="50" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="82" y="330" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">APP-00003</text>
  <text x="82" y="348" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">score 702 &#183; DTI 0.19</text>
  <line x1="232" y1="270" x2="292" y2="270" stroke="#00d2ff" stroke-width="2" marker-end="url(#aCyan)"/>

  <rect x="300" y="140" width="620" height="420" rx="18" fill="#a78bfa" fill-opacity="0.05" stroke="#a78bfa" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="320" y="168" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#a78bfa" letter-spacing="1">THE INSTITUTION&#8217;S PERIMETER</text>

  <rect x="330" y="192" width="248" height="186" rx="12" fill="#0f1620" stroke="#6bcf7f"/>
  <text x="350" y="220" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6bcf7f" letter-spacing="1">POLICY ENGINE</text>
  <circle cx="352" cy="248" r="4" fill="#6bcf7f"/>
  <text x="366" y="253" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">score floor 620</text>
  <circle cx="352" cy="278" r="4" fill="#6bcf7f"/>
  <text x="366" y="283" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">DTI limit 0.45</text>
  <circle cx="352" cy="308" r="4" fill="#ffd93d"/>
  <text x="366" y="313" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">thin-file path</text>
  <text x="366" y="333" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">560 / 0.30 / 12 on-time</text>
  <text x="350" y="362" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">rules + models + overrides</text>
  <line x1="584" y1="285" x2="632" y2="285" stroke="#6bcf7f" stroke-width="2" marker-end="url(#aGreen)"/>

  <text x="650" y="228" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e" letter-spacing="1">DECISION</text>
  <rect x="650" y="242" width="180" height="42" rx="21" fill="#6bcf7f" fill-opacity="0.14" stroke="#6bcf7f"/>
  <text x="740" y="269" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#6bcf7f">APPROVE</text>
  <rect x="650" y="298" width="180" height="42" rx="21" fill="#ff6b6b" fill-opacity="0.12" stroke="#ff6b6b"/>
  <text x="740" y="325" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#ff6b6b">DECLINE</text>
  <rect x="650" y="350" width="230" height="32" rx="6" fill="#161b22" stroke="#ffd93d"/>
  <text x="664" y="372" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#ffd93d">reason: DTI_ABOVE_LIMIT</text>
  <text x="650" y="404" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">an auditable code, not a black-box number</text>

  <rect x="330" y="398" width="560" height="58" rx="10" fill="#00d2ff" fill-opacity="0.07" stroke="#00d2ff" stroke-dasharray="7 5"/>
  <text x="350" y="422" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#00d2ff">REPLAY the proposed policy against historical applications</text>
  <text x="350" y="444" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">approval rate &#183; bad rate &#183; reason-code shift &#8212; measured before promotion</text>
  <line x1="454" y1="396" x2="454" y2="382" stroke="#00d2ff" stroke-width="2" marker-end="url(#aCyan)"/>

  <rect x="330" y="474" width="172" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
  <text x="416" y="497" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c9d1d9">ON-PREMISES</text>
  <rect x="514" y="474" width="180" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
  <text x="604" y="497" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c9d1d9">SOVEREIGN CLOUD</text>
  <rect x="706" y="474" width="168" height="36" rx="18" fill="#161b22" stroke="#30363d"/>
  <text x="790" y="497" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c9d1d9">AIR-GAPPED</text>
  <text x="330" y="536" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">deployment modes a supervised lender can accept</text>

  <line x1="928" y1="316" x2="966" y2="316" stroke="#ff6b6b" stroke-width="2" marker-end="url(#aRed)"/>
  <line x1="944" y1="306" x2="956" y2="326" stroke="#ff6b6b" stroke-width="2"/>
  <line x1="956" y1="306" x2="944" y2="326" stroke="#ff6b6b" stroke-width="2"/>
  <path d="M1000 300 a40 26 0 0 1 40 -24 a52 30 0 0 1 96 4 a34 24 0 0 1 8 44 a30 22 0 0 1 -26 16 h-96 a26 22 0 0 1 -22 -40 z" fill="#ff6b6b" fill-opacity="0.07" stroke="#ff6b6b" stroke-dasharray="6 5"/>
  <text x="1072" y="318" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#ff6b6b">VENDOR TENANCY</text>
  <text x="1072" y="378" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">customer data</text>
  <text x="1072" y="396" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">never leaves</text>

  <text x="60" y="592" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#8b949e">US$13M SERIES A &#183; PARTECH &#183; ALGEBRA VENTURES &#183; SILICON BADIA</text>
  <text x="60" y="614" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6bcf7f">Egypt-founded &#183; one of the largest disclosed AI rounds on the continent this year</text>
  <text x="1140" y="608" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6bcf7f">ml-ke.github.io</text>
</svg>
