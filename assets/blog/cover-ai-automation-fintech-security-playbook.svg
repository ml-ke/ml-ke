<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/><line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/><line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Title -->
  <text x="600" y="60" text-anchor="middle" font-family="sans-serif" font-size="33" font-weight="bold" fill="#f0f6fc">How AI, Automation &amp; AI-Enabled Security Could Have Stopped the NCBA Heist</text>
  <text x="600" y="94" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#8b949e">A Fintech Prevention Playbook — notifications, CI/CD &amp; best practices</text>

  <!-- Shield -->
  <g transform="translate(600, 352)">
    <path d="M0,-170 L140,-120 L140,40 C140,120 80,180 0,205 C-80,180 -140,120 -140,40 L-140,-120 Z"
          fill="none" stroke="#6bcf7f" stroke-width="5"/>
    <path d="M0,-170 L140,-120 L140,40 C140,120 80,180 0,205 C-80,180 -140,120 -140,40 L-140,-120 Z"
          fill="#6bcf7f" fill-opacity="0.06"/>
    <!-- quadrant dividers -->
    <line x1="0" y1="-170" x2="0" y2="205" stroke="#6bcf7f" stroke-width="2" opacity="0.5"/>
    <line x1="-140" y1="20" x2="140" y2="20" stroke="#6bcf7f" stroke-width="2" opacity="0.5"/>

    <!-- Q1: AI eye (top-left) -->
    <g transform="translate(-70, -75)">
      <ellipse rx="44" ry="26" fill="none" stroke="#00d2ff" stroke-width="4"/>
      <circle r="13" fill="#00d2ff"/>
      <circle r="5" fill="#0d1117"/>
    </g>

    <!-- Q2: CI/CD pipeline arrow (top-right) -->
    <g transform="translate(70, -75)">
      <circle cx="-34" cy="0" r="7" fill="none" stroke="#a78bfa" stroke-width="3"/>
      <circle cx="0" cy="0" r="7" fill="none" stroke="#a78bfa" stroke-width="3"/>
      <circle cx="34" cy="0" r="7" fill="#a78bfa"/>
      <line x1="-27" y1="0" x2="-7" y2="0" stroke="#a78bfa" stroke-width="3"/>
      <line x1="7" y1="0" x2="27" y2="0" stroke="#a78bfa" stroke-width="3"/>
      <polygon points="44,0 34,-8 34,8" fill="#a78bfa"/>
    </g>

    <!-- Q3: automation gear (bottom-left) -->
    <g transform="translate(-70, 112)">
      <g stroke="#ffd93d" stroke-width="7" stroke-linecap="round">
        <line x1="0" y1="-38" x2="0" y2="-24"/><line x1="33" y1="-19" x2="21" y2="-12"/>
        <line x1="33" y1="19" x2="21" y2="12"/><line x1="0" y1="38" x2="0" y2="24"/>
        <line x1="-33" y1="-19" x2="-21" y2="-12"/><line x1="-33" y1="19" x2="-21" y2="12"/>
      </g>
      <circle r="24" fill="none" stroke="#ffd93d" stroke-width="6"/>
      <circle r="9" fill="none" stroke="#ffd93d" stroke-width="4"/>
    </g>

    <!-- Q4: notification bell (bottom-right) -->
    <g transform="translate(70, 105)">
      <path d="M-26,14 C-26,-8 -12,-20 0,-20 C12,-20 26,-8 26,14 Z" fill="none" stroke="#ff6b6b" stroke-width="4"/>
      <line x1="-32" y1="14" x2="32" y2="14" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="22" r="6" fill="#ff6b6b"/>
    </g>
  </g>

  <text x="600" y="600" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#8b949e">AI anomaly detection · CI/CD gates · privileged access automation · alerting &amp; reconciliation</text>

  <!-- Logo -->
  <text x="1140" y="600" text-anchor="end" font-family="sans-serif" font-size="18" fill="#6bcf7f">ml-ke.github.io</text>
</svg>
