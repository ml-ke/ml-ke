<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="bead" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d4fd6"/>
    </linearGradient>
    <linearGradient id="beadcut" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9b9b"/>
      <stop offset="100%" stop-color="#ff6b6b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-width="1" opacity="0.032">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <text x="60" y="86" font-family="Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#f2f5f9">Words In, Enzymes Out</text>
  <text x="60" y="126" font-family="Helvetica, Arial, sans-serif" font-size="21" fill="#93a1b3">Two protein-design releases, read by their hit rates</text>
  <line x1="60" y1="152" x2="1140" y2="152" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>

  <rect x="60" y="192" width="310" height="140" rx="12" fill="#00d2ff" fill-opacity="0.05" stroke="#00d2ff" stroke-opacity="0.55" stroke-width="1.5"/>
  <text x="82" y="222" font-family="Helvetica, Arial, sans-serif" font-size="11" letter-spacing="2.4" fill="#00d2ff">PROMPT</text>
  <text x="82" y="262" font-family="Menlo, Consolas, monospace" font-size="17" fill="#e6edf5">design a protease that</text>
  <text x="82" y="290" font-family="Menlo, Consolas, monospace" font-size="17" fill="#e6edf5">cuts TDP-43, and</text>
  <text x="82" y="318" font-family="Menlo, Consolas, monospace" font-size="17" fill="#e6edf5">nothing else</text>

  <path d="M 378 262 C 430 262, 435 330, 462 386" fill="none" stroke="#00d2ff" stroke-opacity="0.6" stroke-width="1.6" stroke-dasharray="5 5"/>
  <path d="M 455 375 L 469 391 L 449 394 Z" fill="#00d2ff" fill-opacity="0.8"/>

  <g stroke="#a78bfa" stroke-opacity="0.45" stroke-width="6">
    <line x1="502" y1="400" x2="558" y2="400"/>
    <line x1="558" y1="400" x2="614" y2="400"/>
    <line x1="614" y1="400" x2="650" y2="400"/>
    <line x1="718" y1="400" x2="774" y2="400"/>
    <line x1="774" y1="400" x2="830" y2="400"/>
    <line x1="830" y1="400" x2="886" y2="400"/>
  </g>

  <g>
    <circle cx="488" cy="400" r="16" fill="url(#bead)"/>
    <circle cx="544" cy="400" r="16" fill="url(#bead)"/>
    <circle cx="600" cy="400" r="16" fill="url(#bead)"/>
    <circle cx="656" cy="400" r="16" fill="url(#bead)"/>
    <circle cx="712" cy="400" r="16" fill="url(#beadcut)"/>
    <circle cx="768" cy="400" r="16" fill="url(#bead)"/>
    <circle cx="824" cy="400" r="16" fill="url(#bead)"/>
    <circle cx="880" cy="400" r="16" fill="url(#bead)"/>
  </g>

  <line x1="684" y1="372" x2="684" y2="428" stroke="#ff6b6b" stroke-width="2.5" stroke-dasharray="6 5"/>
  <g>
    <rect x="668" y="300" width="32" height="16" rx="4" fill="#2a2f3d" stroke="#ff6b6b" stroke-opacity="0.5"/>
    <polygon points="656,318 712,318 684,374" fill="url(#blade)"/>
  </g>
  <text x="684" y="288" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#ff8f8f">one targeted bond</text>

  <text x="488" y="452" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#93a1b3">left fragment</text>
  <text x="768" y="452" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#93a1b3">right fragment</text>
  <text x="684" y="452" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6f7d8f">10 million bonds nearby</text>

  <g>
    <rect x="60" y="492" width="336" height="86" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#6bcf7f" stroke-opacity="0.4"/>
    <text x="82" y="530" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#6bcf7f">13 of 69</text>
    <text x="82" y="558" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#93a1b3">cysteine protease designs cut their target</text>

    <rect x="412" y="492" width="336" height="86" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#6bcf7f" stroke-opacity="0.4"/>
    <text x="434" y="530" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#6bcf7f">36 percent</text>
    <text x="434" y="558" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#93a1b3">of 135 zinc designs cut their target</text>

    <rect x="764" y="492" width="376" height="86" rx="10" fill="#ffffff" fill-opacity="0.035" stroke="#ffd93d" stroke-opacity="0.4"/>
    <text x="786" y="530" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffd93d">1 of 29</text>
    <text x="786" y="558" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#93a1b3">tested fluorescent designs glowed</text>
  </g>

  <text x="1140" y="616" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#5d6a7a">ml-ke.github.io</text>
</svg>
