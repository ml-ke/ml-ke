<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="A committed capital bar split into fee, opex, reserve and primary slices, above a grid of eighty-four cheque slots with eleven lit">
