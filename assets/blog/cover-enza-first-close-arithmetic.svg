<text x="70" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="15" letter-spacing="3" fill="#00d2ff">FIRST CLOSE, NOVEMBER 2026</text>
<text x="70" y="188" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#f0f6fc">A first close is</text>
<text x="70" y="238" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#f0f6fc">not a cheque</text>
<text x="70" y="292" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">Fees, operating costs and a follow-on</text>
<text x="70" y="318" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">reserve leave the fund before a founder</text>
<text x="70" y="344" font-family="Inter, Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">sees a wire.</text>
<text x="70" y="418" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#6e7681">USD 21.0m committed, 35% of a USD 60m target</text>
<text x="70" y="442" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#6e7681">first investments scheduled for 2027</text>

<text x="560" y="120" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#6e7681">WHERE 21.0m GOES</text>

<text x="560" y="152" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#ff6b6b">fees 4.20</text>
<text x="712" y="152" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#a78bfa">reserve 8.04</text>
<text x="944" y="152" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" fill="#6bcf7f">primary 8.04</text>

<rect x="560" y="164" width="112" height="34" fill="#ff6b6b" fill-opacity="0.28" stroke="#ff6b6b" stroke-opacity="0.6"/>
<rect x="672" y="164" width="19" height="34" fill="#ffd93d" fill-opacity="0.35" stroke="#ffd93d" stroke-opacity="0.6"/>
<rect x="691" y="164" width="214" height="34" fill="#a78bfa" fill-opacity="0.24" stroke="#a78bfa" stroke-opacity="0.6"/>
