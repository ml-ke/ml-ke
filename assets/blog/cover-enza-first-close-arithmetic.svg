<text x="640" y="242" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12.5" fill="#ffd93d">opex 0.71</text>

<text x="560" y="300" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="2" fill="#6e7681">FIRST CHEQUES</text>
<rect x="560" y="318" width="16" height="16" rx="3" fill="#6bcf7f" fill-opacity="0.55" stroke="#6bcf7f"/>
<text x="586" y="331" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#e6edf3">11 at the 0.75m sweet spot</text>
<rect x="560" y="348" width="16" height="16" rx="3" fill="none" stroke="#8b949e" stroke-opacity="0.4"/>
<text x="586" y="361" font-family="Inter, Helvetica, Arial, sans-serif" font-size="14" fill="#8b949e">84 slots at the 0.25m floor</text>

