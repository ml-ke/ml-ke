<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="lexbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd93d" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#ffd93d" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="mergebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6bcf7f" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#6bcf7f" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200 M0 360 H1200 M0 450 H1200 M0 540 H1200"/>
    <path d="M100 0 V630 M250 0 V630 M400 0 V630 M550 0 V630 M700 0 V630 M850 0 V630 M1000 0 V630 M1150 0 V630"/>
  </g>

  <text x="60" y="60" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#f0f6fc">Fuse Ranks, Not Scores</text>
  <text x="60" y="94" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" fill="#8b949e">Hybrid retrieval with BM25 and a dense index, measured on 30 labelled queries</text>

  <!-- lexical column -->
  <text x="60" y="150" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffd93d" letter-spacing="2">LEXICAL · BM25</text>

  <text x="60" y="184" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">1</text>
  <rect x="80" y="170" width="220" height="20" rx="4" fill="url(#lexbar)"/>
  <text x="88" y="185" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#0d1117" font-weight="bold">agri-4021  13.2</text>

  <text x="60" y="222" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">2</text>
  <rect x="80" y="208" width="165" height="20" rx="4" fill="url(#lexbar)"/>
  <text x="88" y="223" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#0d1117" font-weight="bold">d2   9.4</text>

  <text x="60" y="260" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">3</text>
  <rect x="80" y="246" width="120" height="20" rx="4" fill="url(#lexbar)"/>
  <text x="88" y="261" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#0d1117" font-weight="bold">d4   6.1</text>

  <text x="60" y="298" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">4</text>
  <rect x="80" y="284" width="95" height="20" rx="4" fill="url(#lexbar)"/>
  <text x="88" y="299" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#0d1117" font-weight="bold">d7   3.3</text>

  <!-- semantic column -->
  <text x="900" y="150" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#00d2ff" letter-spacing="2">SEMANTIC · DENSE</text>

  <text x="900" y="184" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">1</text>
  <circle cx="928" cy="178" r="14" fill="#00d2ff" fill-opacity="0.85"/>
  <text x="954" y="184" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#c9d1d9">d2   0.71</text>

  <text x="900" y="222" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">2</text>
  <circle cx="928" cy="216" r="12" fill="#00d2ff" fill-opacity="0.72"/>
  <text x="954" y="222" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#c9d1d9">d9   0.58</text>

  <text x="900" y="260" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">3</text>
  <circle cx="928" cy="254" r="10" fill="#00d2ff" fill-opacity="0.60"/>
  <text x="954" y="260" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#c9d1d9">d7   0.49</text>

  <text x="900" y="298" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">4</text>
  <circle cx="928" cy="292" r="8" fill="#00d2ff" fill-opacity="0.45"/>
  <text x="954" y="298" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#c9d1d9">d3   0.31</text>

  <!-- arrows into the fusion block -->
  <path d="M320 240 C380 240, 390 300, 420 300" stroke="#ffd93d" stroke-width="2" stroke-opacity="0.75" fill="none"/>
  <path d="M420 300 l-10 -5 v10 z" fill="#ffd93d"/>
  <path d="M900 240 C840 240, 830 300, 800 300" stroke="#00d2ff" stroke-width="2" stroke-opacity="0.75" fill="none"/>
  <path d="M800 300 l10 -5 v10 z" fill="#00d2ff"/>

  <!-- fusion block -->
  <rect x="430" y="266" width="360" height="74" rx="10" fill="#6bcf7f" fill-opacity="0.10" stroke="#6bcf7f" stroke-opacity="0.55"/>
  <text x="610" y="294" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#f0f6fc">score(d) = sum over lists of 1 / (k + rank)</text>
  <text x="610" y="320" text-anchor="middle" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">no score normalisation, no tuned weight</text>

  <!-- merged stack -->
  <text x="430" y="378" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#6bcf7f" letter-spacing="2">MERGED TOP-4</text>

  <rect x="430" y="390" width="360" height="34" rx="6" fill="#6bcf7f" fill-opacity="0.16" stroke="#6bcf7f" stroke-opacity="0.7"/>
  <text x="444" y="412" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#6bcf7f">1   d7   raised from rank 4 and 3</text>

  <rect x="430" y="430" width="360" height="34" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#8b949e" stroke-opacity="0.55"/>
  <text x="444" y="452" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">2   d2   rank 1 then rank 2</text>

  <rect x="430" y="470" width="360" height="34" rx="6" fill="#ffffff" fill-opacity="0.05" stroke="#8b949e" stroke-opacity="0.55"/>
  <text x="444" y="492" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#c9d1d9">3   d4   seen by one list only</text>

  <rect x="430" y="510" width="360" height="34" rx="6" fill="#ff6b6b" fill-opacity="0.10" stroke="#ff6b6b" stroke-opacity="0.55" stroke-dasharray="5 3"/>
  <text x="444" y="532" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="14" fill="#ff6b6b">4   d3   demoted: one list only</text>

  <!-- side notes -->
  <text x="60" y="400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">R@10   0.73 lexical</text>
  <text x="60" y="422" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">0.57 semantic</text>
  <text x="60" y="444" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#6bcf7f" font-weight="bold">0.83 fused</text>

  <text x="830" y="400" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#ffd93d">k = 60: rank 1 vs rank 10</text>
  <text x="830" y="422" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#ffd93d">worth only 1.15x</text>
  <text x="830" y="444" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">so agreement beats confidence</text>

  <text x="60" y="580" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e">rank-only fusion cannot see the score scale that broke your weighted sum</text>

  <text x="1140" y="600" text-anchor="end" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">ml-ke.github.io</text>
</svg>
