  <!-- stat strip -->
  <g>
    <text x="360" y="392" fill="#ffd93d" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">MEASURED COST, ONE A100</text>
    <text x="360" y="418" fill="#e6e9ee" font-family="Helvetica, Arial, sans-serif" font-size="15">11 to 24 frames/s per regime &#183; 0.9 to 1.9 TFLOP per step</text>
    <text x="360" y="442" fill="#e6e9ee" font-family="Helvetica, Arial, sans-serif" font-size="15">4.7 GB per fp16 attention matrix at 50,000 particles</text>
    <text x="360" y="466" fill="#9aa4b2" font-family="Helvetica, Arial, sans-serif" font-size="14">the ceiling is memory on the first full-resolution layer</text>
  </g>

  <g>
    <text x="360" y="506" fill="#6bcf7f" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">THE STEP THAT MATTERS</text>
