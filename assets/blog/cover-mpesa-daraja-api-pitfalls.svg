<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d2ff"/>
      <stop offset="1" stop-color="#6bcf7f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- title -->
  <text x="60" y="66" font-family="Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="bold" fill="#f0f6fc">M-PESA API Security</text>
  <text x="62" y="104" font-family="Helvetica Neue, Arial, sans-serif" font-size="21" fill="#8b949e">Daraja integration pitfalls that lose real money</text>

  <!-- ===== MERCHANT SERVER (left) ===== -->
  <rect x="70" y="160" width="290" height="240" rx="18" fill="#161b22" stroke="#00d2ff" stroke-opacity="0.55" stroke-width="2"/>
  <text x="90" y="195" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="bold" letter-spacing="2" fill="#00d2ff">MERCHANT SERVER</text>
  <rect x="90" y="212" width="250" height="128" rx="8" fill="#0d1117" stroke="#30363d"/>
  <text x="102" y="238" font-family="Consolas, Menlo, monospace" font-size="14" fill="#e6edf3">from dotenv import load_dotenv</text>
  <text x="102" y="262" font-family="Consolas, Menlo, monospace" font-size="14" fill="#e6edf3">consumer_secret = os.getenv(</text>
  <text x="102" y="286" font-family="Consolas, Menlo, monospace" font-size="14" fill="#e6edf3">    "DARAJA_SECRET")</text>
  <text x="102" y="318" font-family="Consolas, Menlo, monospace" font-size="14" fill="#ff6b6b">git commit -am "add .env"  # oops</text>
  <!-- git leak hint -->
  <text x="90" y="372" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="bold" fill="#ff6b6b">CONSUMER_SECRET pushed to public repo</text>

  <!-- ===== DARAJA GATEWAY (right) ===== -->
  <rect x="840" y="160" width="290" height="240" rx="18" fill="#161b22" stroke="#6bcf7f" stroke-opacity="0.55" stroke-width="2"/>
  <text x="860" y="195" font-family="Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="bold" letter-spacing="2" fill="#6bcf7f">DARAJA API</text>
  <text x="860" y="216" font-family="Helvetica Neue, Arial, sans-serif" font-size="13" fill="#8b949e">Safaricom M-PESA · OAuth token · STK Push</text>
  <!-- shield + check -->
  <path d="M985 240 l55 0 l0 48 c0 34 -27 52 -55 62 c-28 -10 -55 -28 -55 -62 l0 -48 z" fill="#0d1117" stroke="#6bcf7f" stroke-width="3"/>
  <path d="M952 292 l14 14 l26 -30" fill="none" stroke="#6bcf7f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1048" y="268" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#8b949e">HTTPS +</text>
  <text x="1048" y="290" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#8b949e">timestamped</text>
  <text x="1048" y="312" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" fill="#8b949e">requests</text>

  <!-- ===== PAYMENT RAIL ===== -->
  <line x1="360" y1="300" x2="840" y2="300" stroke="url(#rail)" stroke-width="5" stroke-dasharray="10 8"/>

  <!-- joints 1-3 -->
  <g>
    <circle cx="465" cy="300" r="17" fill="#0d1117" stroke="#ffd93d" stroke-width="3"/>
    <text x="465" y="307" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#ffd93d">1</text>
    <circle cx="600" cy="300" r="17" fill="#0d1117" stroke="#ffd93d" stroke-width="3"/>
    <text x="600" y="307" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#ffd93d">2</text>
    <circle cx="735" cy="300" r="17" fill="#0d1117" stroke="#ffd93d" stroke-width="3"/>
    <text x="735" y="307" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#ffd93d">3</text>
  </g>

  <!-- ===== ATTACK VECTORS (red, from below) ===== -->
  <!-- joint 1: leaked secret -->
  <line x1="465" y1="535" x2="465" y2="326" stroke="#ff6b6b" stroke-width="4"/>
  <polygon points="465,312 456,328 474,328" fill="#ff6b6b"/>
  <text x="465" y="560" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#ff6b6b">LEAKED SECRET</text>
  <text x="465" y="586" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8b949e">spends from your till</text>

  <!-- joint 2: fake callback -->
  <line x1="600" y1="535" x2="600" y2="326" stroke="#ff6b6b" stroke-width="4"/>
  <polygon points="600,312 591,328 609,328" fill="#ff6b6b"/>
  <text x="600" y="560" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#ff6b6b">FAKE CALLBACK</text>
  <text x="600" y="586" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8b949e">POST forged ResultCode 0</text>

  <!-- joint 3: spoofed push -->
  <line x1="735" y1="535" x2="735" y2="326" stroke="#ff6b6b" stroke-width="4"/>
  <polygon points="735,312 726,328 744,328" fill="#ff6b6b"/>
  <text x="735" y="560" font-family="Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="bold" text-anchor="middle" fill="#ff6b6b">SPOOFED PUSH</text>
  <text x="735" y="586" font-family="Helvetica Neue, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#8b949e">prompt you never sent</text>

  <!-- ===== LOGO ===== -->
  <text x="1010" y="612" font-family="Helvetica Neue, Arial, sans-serif" font-size="15" fill="#8b949e">ml-ke.github.io</text>
</svg>
