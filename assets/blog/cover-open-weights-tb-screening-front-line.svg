<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2233"/>
      <stop offset="100%" stop-color="#080b12"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd93d" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffd93d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path d="M100 0V630M200 0V630M300 0V630M400 0V630M500 0V630M600 0V630M700 0V630M800 0V630M900 0V630M1000 0V630M1100 0V630"/>
  </g>

  <!-- ============ the shaft ============ -->
  <polygon points="70,150 430,150 300,520 200,520" fill="url(#shaft)" stroke="#2b3444" stroke-width="2"/>
  <!-- depth ticks -->
  <g stroke="#3c4759" stroke-width="1.5">
    <path d="M70,150H430"/>
    <path d="M96,242H404" stroke-dasharray="6 6"/>
    <path d="M114,334H386" stroke-dasharray="6 6"/>
    <path d="M132,426H368" stroke-dasharray="6 6"/>
  </g>
  <g fill="#6b7688" font-family="Helvetica, Arial, sans-serif" font-size="15">
    <text x="440" y="155">surface</text>
    <text x="412" y="247">1 km</text>
    <text x="394" y="339">2 km</text>
    <text x="376" y="431">3 km</text>
  </g>
  <circle cx="250" cy="500" r="95" fill="url(#lamp)"/>
  <text x="250" y="546" fill="#ffd93d" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle">4 km down</text>

  <!-- working face: portable detector on a table -->
  <rect x="146" y="470" width="208" height="10" rx="3" fill="#39435a"/>
  <rect x="156" y="392" width="76" height="76" rx="5" fill="#0f1621" stroke="#00d2ff" stroke-width="2"/>
  <g stroke="#7ad9f5" stroke-width="2" fill="none" stroke-opacity="0.85">
    <path d="M186 400v58M206 400v58"/>
    <path d="M168 414q18 10 0 20M220 414q-14 10 0 20"/>
    <path d="M170 440q16 8 0 16M218 440q-12 8 0 16"/>
  </g>
  <text x="194" y="486" fill="#7ad9f5" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">film</text>

  <!-- offline inference box -->
  <rect x="252" y="418" width="86" height="52" rx="5" fill="#131c2a" stroke="#2b3444" stroke-width="2"/>
  <circle cx="266" cy="432" r="4" fill="#6bcf7f"/>
  <text x="278" y="437" fill="#6bcf7f" font-family="Helvetica, Arial, sans-serif" font-size="12">45 s</text>
  <text x="295" y="461" fill="#9aa6b8" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">offline</text>

  <!-- no-uplink marker -->
  <g transform="translate(352,392)">
    <circle r="20" fill="none" stroke="#ff6b6b" stroke-width="2.5"/>
    <path d="M-9 9L9-9" stroke="#ff6b6b" stroke-width="2.5"/>
    <path d="M-11-3a16 16 0 0 1 22 0M-6-8a9 9 0 0 1 12 0" stroke="#ff6b6b" stroke-width="2" fill="none" stroke-opacity="0.6"/>
  </g>
  <text x="352" y="432" fill="#ff6b6b" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle">no uplink</text>

  <!-- ============ title ============ -->
  <text x="520" y="120" fill="#e8eef7" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold">Open weights,</text>
  <text x="520" y="170" fill="#e8eef7" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold">45 seconds,</text>
  <text x="520" y="220" fill="#00d2ff" font-family="Helvetica, Arial, sans-serif" font-size="40" font-weight="bold">4 km underground</text>
  <text x="520" y="256" fill="#9aa6b8" font-family="Helvetica, Arial, sans-serif" font-size="19">TB screening in 40 clinics, six countries, and one national programme</text>

  <!-- ============ model cards ============ -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="520" y="300" width="270" height="72" rx="8" fill="#121a27" stroke="#00d2ff" stroke-opacity="0.55" stroke-width="2"/>
    <text x="538" y="330" fill="#7ad9f5" font-size="17" font-weight="bold">image encoder</text>
    <text x="538" y="356" fill="#9aa6b8" font-size="15">400M + 400M params, 448 px</text>

    <rect x="520" y="388" width="270" height="72" rx="8" fill="#121a27" stroke="#a78bfa" stroke-opacity="0.55" stroke-width="2"/>
    <text x="538" y="418" fill="#c4b5fd" font-size="17" font-weight="bold">vision-language</text>
    <text x="538" y="444" fill="#9aa6b8" font-size="15">4B open weights, on-device</text>

    <rect x="520" y="476" width="270" height="72" rx="8" fill="#121a27" stroke="#6bcf7f" stroke-opacity="0.55" stroke-width="2"/>
    <text x="538" y="506" fill="#9ee0ab" font-size="17" font-weight="bold">cough audio</text>
    <text x="538" y="532" fill="#9aa6b8" font-size="15">300M clips, phone microphone</text>
  </g>

  <!-- weight path down to the working face -->
  <path d="M500 336C470 380 430 430 400 470 380 496 348 500 340 500" fill="none" stroke="#00d2ff" stroke-width="2" stroke-dasharray="7 7" stroke-opacity="0.7"/>
  <circle cx="500" cy="336" r="4" fill="#00d2ff"/>

  <!-- price badge -->
  <g font-family="Helvetica, Arial, sans-serif">
    <rect x="838" y="392" width="300" height="156" rx="10" fill="#101827" stroke="#2b3444" stroke-width="2"/>
    <text x="860" y="428" fill="#9aa6b8" font-size="15">per study</text>
    <text x="860" y="482" fill="#ffd93d" font-size="46" font-weight="bold">$0.70</text>
    <text x="860" y="512" fill="#9aa6b8" font-size="15">25,000 films reviewed</text>
    <text x="860" y="534" fill="#9aa6b8" font-size="15">CE MDR class IIb device</text>
  </g>

  <text x="1160" y="606" fill="#5b6577" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="end">ml-ke.github.io</text>
</svg>
